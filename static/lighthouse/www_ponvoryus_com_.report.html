iv class=\"bg-[#2c419d] text-white p-6 flex items-center justify-center promo-banner\" data-v-251ed116>\u003ca href=\"https://vandasurveys.com/s/ponvory-opt-in\" target=\"_blank\" class=\"promo-button rounded-3xl\" data-v-251ed116>\u003cspan class=\"bg-[#c83327] font-poppins uppercase p-2 px-4 md:p-4 md:px-8 text-white rounded-lg font-extrabold text-[1rem] md:text-3xl hover:bg-red-500 md:w-auto hover:text-white flex items-center gap-2\" data-v-251ed116>Learn more ▸\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c!--]-->\u003cmain class=\"bg-white rounded-md overflow-clip mb-4 md:mb-6 mx-auto\">\u003c!--[-->\u003cdiv class=\"main-container container\">\u003cdiv class=\"row\">\u003csection class=\"col-sm-12\">\u003ca id=\"main-content\">\u003c/a>\u003cdiv class=\"region region-content\">\u003csection id=\"block-system-main\" class=\"block block-system clearfix\">\u003carticle id=\"node-50\" class=\"node node-page clearfix\">\u003cdiv class=\"field field-name-body field-type-text-with-summary field-label-hidden\">\u003cdiv class=\"field-items\">\u003cdiv class=\"field-item even\">\u003cdiv class=\"bs-grid container-fluid homepage\" id=\"bs-grid-edit-body-und-0-value-3\">\u003cdiv class=\"row row-1 row-first sec-1 video-section\">\u003cdiv class=\"col col-first col-last col-md-12\">\u003cdiv class=\"content\">\u003cdiv class=\"img-wrapper home-nav-bottom-img\">\u003cdiv class=\"media-embed video-cont\" style=\"height:28vw;overflow:hidden;max-height:450px;\">\u003cdiv style=\"display:block;position:relative;max-width:px;\">\u003cdiv style=\"padding-top:56.25%;\" class=\"bc-6-responsible\">\u003cvideo id=\"homeVideo\" style=\"width:100%;height:100%;position:absolute;top:0px;bottom:0px;right:0px;left:0px;border-bottom-left-radius:70px !important;\" playsinline loop muted preload=\"auto\" oncontextmenu=\"return false;\">\u003csource src=\"https://www.videos.ponvoryus.com/homepage-video/index_master.m3u8\" type=\"application/x-mpegURL\">\u003c/video>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"video-text\">\u003cpicture>\u003csource media=\"(min-width: 992px)\" type=\"image/webp\" srcset=\"/assets/static/ready-for-unexpected.27c34987.webp\">\u003csource media=\"(max-width: 991px)\" srcset=\"/assets/static/ready-for-unexpected-mob.5bd6f464.png\">\u003cimg class=\"img-responsive\" src=\"/assets/static/ready-for-unexpected.c62afb65.png\" width=\"239\" height=\"193\" alt=\"Ready For The Unexpected Logo\" title>\u003c/picture>\u003c/p>\u003cp class=\"footnote video-foot-text\"> Not an actual patient. \u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"row row-2 sec-2 accordian\">\u003cdiv class=\"col col-first col-last col-md-12\">\u003cdiv class=\"content\">\u003cdiv class=\"ponvory-section-description\">\u003cdiv class=\"ponvory-desc\"> Relapsing MS is unpredictable, and your health considerations may change over time. An agile treatment plan can help your healthcare team adapt to your needs. With PONVORY®, your healthcare professional can be ready to help manage certain unexpected events you may face along your MS journey, including \u003cstrong>relapses and lesions\u003c/strong> or needing to pause therapy for \u003cstrong>vaccines, infections, or family planning\u003c/strong>. \u003c/div>\u003ch2 class=\"ponvory-header\"> PONVORY\u003csup>®\u003c/sup>, A ONCE-DAILY PILL FOR ADULTS WITH RELAPSING MS\u003cbr>\u003c/h2>\u003cdiv class=\"accordian-wrapper\">\u003cdiv aria-multiselectable=\"true\" class=\"bs-accordion panel-group home-page-accordion\" id=\"bs-accordion-bqhv243l\" role=\"tablist\">\u003cdiv class=\"panel panel-default panel-1 panel-first\">\u003cdiv class=\"panel-heading\" id=\"bs-accordion-bqhv243l-h1\" role=\"tab\">\u003ch4 class=\"panel-title\">\u003ca aria-controls=\"bs-accordion-bqhv243l-c1\" aria-expanded=\"true\" data-parent=\"#bs-accordion-bqhv243l\" data-toggle=\"collapse\" href=\"#bs-accordion-bqhv243l-c1\" role=\"button\">\u003cspan>PROVEN RESULTS\u003c/span>\u003c/a>\u003cbr>\u003c/h4>\u003c/div>\u003cdiv aria-labelledby=\"bs-accordion-bqhv243l-h1\" class=\"panel-collapse collapse in\" id=\"bs-accordion-bqhv243l-c1\" role=\"tabpanel\">\u003cdiv class=\"panel-body\">\u003cp>\u003cstrong>\u003cspan class=\"underline\">\u003ca href=\"clinical-study-results/\">Superior at reducing relapses* and the number of new or enlarging lesions\u003c/a>\u003c/span>*\u003c/strong> vs a proven oral therapy in a study lasting ~2 years \u003c/p>\u003cp>\u003cstrong>\u003cspan class=\"underline\">\u003ca href=\"clinical-study-results/\">No disability progression\u003c/a>\u003c/span>\u003c/strong> for ~90% of people over 2 years, as measured by time to 3-month CDP\u003csup class=\"dag dagger\">†\u003c/sup>\u003c/p>\u003cp>\u003cstrong>\u003cspan class=\"underline\">\u003ca href=\"side-effects-of-ponvory/\">Over 10 years of data\u003c/a>\u003c/span>\u003c/strong> across multiple studies show PONVORY® has a \u003cstrong>\u003cspan class=\"underline\">\u003ca href=\"side-effects-of-ponvory/\">proven safety profile\u003c/a>\u003c/span>\u003c/strong> and is generally well-tolerated\u003csup class=\"dag dbl-dagger\">‡\u003c/sup>\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"panel panel-default panel-2 panel-last\">\u003cdiv class=\"panel-heading\" id=\"bs-accordion-bqhv243l-h2\" role=\"tab\">\u003ch4 class=\"panel-title\">\u003ca aria-controls=\"bs-accordion-bqhv243l-c2\" aria-expanded=\"false\" class=\"collapsed\" data-parent=\"#bs-accordion-bqhv243l\" data-toggle=\"collapse\" href=\"#bs-accordion-bqhv243l-c2\" role=\"button\">\u003cspan>AN AGILE TREATMENT PLAN\u003c/span>\u003c/a>\u003cbr>\u003c/h4>\u003c/div>\u003cdiv aria-labelledby=\"bs-accordion-bqhv243l-h2\" class=\"panel-collapse collapse\" id=\"bs-accordion-bqhv243l-c2\" role=\"tabpanel\">\u003cdiv class=\"panel-body\">\u003cp> With your healthcare professional’s guidance, \u003cstrong>PONVORY\u003c/strong>® \u003cstrong>can be paused\u003c/strong>, if needed, \u003cstrong>and then restarted\u003c/strong>\u003csup class=\"que\">§\u003c/sup>\u003c/p>\u003cp> PONVORY® locks away immune cells (lymphocytes) without destroying them.\u003csup class=\"dbl-line\">¶\u003c/sup> This means \u003cspan class=\"underline\">\u003ca href=\"agile-treatment-plan/#vaccine-infections\">\u003cstrong>lymphocytes may return to normal levels 1 to 2 weeks after pausing,\u003c/strong>\u003c/a>\u003c/span>\u003csup class=\"hash\">#\u003c/sup> which may be important when planning for certain vaccines or addressing infections \u003c/p>\u003cp> For those thinking about planning for a family,\u003csup class=\"dbl-line\">ll  \u003c/sup>\u003cspan class=\"underline\">\u003ca href=\"agile-treatment-plan/#family-planning\">\u003cstrong>PONVORY\u003c/strong>® \u003cstrong>leaves the body naturally in ~7 days after pausing\u003c/strong>\u003c/a>\u003c/span>** \u003c/p>\u003cp> Always talk to your healthcare professional before pausing PONVORY® for any reason \u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cp> \u003c/p>\u003c/div>\u003cdiv class=\"footnote\">\u003cp class=\"no-indent\"> CDP = confirmed disability progression; MS = multiple sclerosis. \u003c/p>\u003cp class=\"hash-star\"> *In a phase 3 study vs Aubagio® lasting ~2 years, PONVORY® was shown to reduce the average number of relapses per year and the average number of new gadolinium-enhancing T1 and new or enlarging T2 lesions. \u003c/p>\u003cp>\u003csup>†\u003c/sup>There was no statistically significant difference between treatment groups. \u003c/p>\u003cp>\u003csup>‡\u003c/sup>Includes the phase 3 study; the phase 2, 6-month, placebo-controlled study; and the uncontrolled extension studies. \u003c/p>\u003cp>\u003csup>§\u003c/sup>If PONVORY® is paused for 4 or more days in a row, treatment must be restarted with a new 14-Day Starter Pack. \u003c/p>\u003cp>\u003csup>¶\u003c/sup>The exact way PONVORY® works in MS is unknown, but it is believed to work by reducing the number of lymphocytes in the blood. \u003c/p>\u003cp class=\"hash-star\">\u003csup>#\u003c/sup>In the phase 3 study, lymphocyte counts returned to normal range within 2 weeks after stopping PONVORY®. \u003c/p>\u003cp class=\"dbl-dash\">\u003csup>ll\u003c/sup>PONVORY® should not be taken during pregnancy. Tell your healthcare professional right away if you become pregnant or plan on becoming pregnant. \u003c/p>\u003cp class=\"dbl-star\"> **No elimination procedure required. \u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"row row-3 row-last sec-3\">\u003cdiv class=\"col col-first col-last col-md-12\">\u003cdiv class=\"content\">\u003cp> \u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"row row-4 sec-4 ponvory-callout\">\u003cdiv class=\"col col-first ponvory-left col-md-6\">\u003cdiv class=\"content\">\u003cdiv class=\"img\">\u003cimg class=\"img-responsive\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEoAAABKCAMAAAArDjJDAAAB5lBMVEUAAADN2gHN2gHN2gHN2gHN2gHN2gHN2gHN2gHN2gHN2gHN2gHN2gHN2gHN2gHN2gHN2gHN2gHN2gH///////7+//z+/vn9/vf9/vb9/vX8/fH8/fD8/e/8/e78/O37/Oz7/Or6++b5++D4+t33+df2+NL2+ND1+M7z9sPy9bvw9LTw9LLw9LDv867v86zu8qft8qXt8qTt8qLs8aDr8Jrr8Jjr8Jfq8Jbq75Tp747o7ovn7YXn7YTn7YPm7YLl7Hrk63jk63Xj6nLj6nHh6Wjh6WXg6GTg6GPg6GHe51re51ne5lbc5Uva40La40HZ4z/Z4z7Z4zzY4jrY4jfX4jbX4TTX4TLW4THW4TDW4S/W4S7V4CrU4CfU3ybU3yXT3yLT3yHT3iDT3h7S3hrS3RnR3RbQ3BLQ3BHQ3A/Q3A7P3A3P3AzP2wnO2wjO2wbO2wXO2gTN2gPN2gHM2QLM2QHG1QXG1QTE0wbC0gbB0Qe/0Ai5zAu4ywu3ygy2yQy0yA2xxg+vxBCtwxGnvxShuheatRqQrh+PrSCNrCCKqSJ6nip1myxmkDRljzReijhdiThciTlTgj1Sgj1MfUFLfUFIekM3bks1bEwza00oY1IlYVQkYFQhXlYbWlkYWFoWV1sVVlsUVVyitNHZAAAAE3RSTlMACh5ER0xReYiJprKztMzc7/H2cj4j/gAAAm5JREFUeNrt2NdXE0EUBvBJDzH9GhUrxopGo0axiwhiX3sDCyKIBVE+EQsWsGHvIla8/6kPIZiN7G6y3BePfE+bM5vf2UnOzLdnlNLH4faHIjHYiR5yBeKwnXzIE8ZY8gdyBgEZyhuFEOUDhKgySFECzzRMeSFFOaNiVBBSlAdiVFiMcpmOXz5+1CjHLhRSAVNqERln8jY95TDfC5ImFE1q1VFuWFCbmgxymGifjvJbUbVGQ21Emo4KyVEROSomR2Gcskc1/7XQZtO67EXD1ZKoEwmTVTL3TClU83SzFbespAl2tBlmPc0f488+ktpx6j+jGi5JUbtosRSVvf36y88f+4Dbbwff9QB33w++uWmXes3MX7rxiZ g\">\u003cimg class=\"img-responsive\" src=\"/assets/static/girl-black-white-desk_j3optimized.276eb6d9.png\" width=\"1366\" height=\"640\" alt=\"girl black white\" title>\u003c/picture>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bs-grid container-fluid next-section-wrapper\" id=\"bs-grid-edit-body-und-0-value-0\">\u003cdiv class=\"row row-1 row-first row-last next-section\">\u003cdiv class=\"col col-first section-left col-last col-md-12\">\u003cdiv class=\"content\">\u003cdiv class=\"img\">\u003cimg class=\"img-responsive\" src=\"/assets/static/learn-more.31d4051d.svg\" alt=\"checklist icon\">\u003c/div>\u003cdiv class=\"next-text\">\u003ca href=\"what-is-ponvory/\">Learn more about PONVORY®\u003c/a>\u003cspan class=\"arrow\">\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\u003c/section>\u003c/div>\u003c/section>\u003c/div>\u003c/div>\u003c!--]-->\u003c/main>\u003cdiv class=\"w-screen border-t-4 border-[#045d67]\">\u003c/div>\u003cdiv class=\"isi\">\u003cdiv class=\"fixed bottom-0 w-full border-t-4 lg:border-t-2 border-[#045d67] z-10\">\u003c!---->\u003cdiv class=\"\">\u003c/div>\u003cdiv class=\"lg:py-8 lg:px-0 bg-white h-[22rem] lg:h-[18rem] overflow-none\">\u003cdiv class=\"max-w-screen-xl mx-auto grid grid-cols-1 lg:grid lg:grid-cols-3 lg:space-x-8 lg:pl-12 lg:pr-8\">\u003cdiv class=\"2xs:border-t-2 2xs:border-[#045d67] lg:border-t-0 col-span-1 order-2 lg:order-1 lg:col-span-2 mt-2 lg:mt-0 2xs:pl-12 2xs:pr-6 lg:px-0 lg:pr-12 flex lg:block\">\u003cdiv class=\"region region-isi\" data-v-8e88bfa1>\u003csection id=\"block-panels-mini-important-safety-information\" class=\"block block-panels-mini clearfix\" data-v-8e88bfa1>\u003cdiv id=\"sticky-container-mini-panel-important-safety-information\" class=\"fs-sticky-container\" data-v-8e88bfa1>\u003cdiv class=\"panel-display panel-1col clearfix\" id=\"mini-panel-important_safety_information\" data-v-8e88bfa1>\u003cdiv class=\"panel-panel panel-col\" data-v-8e88bfa1>\u003cdiv data-v-8e88bfa1>\u003cdiv class=\"panel-pane pane-block pane-jjfusion-sticky-panel-janssen-isi-content\" data-v-8e88bfa1>\u003cdiv class=\"pane-content\" data-v-8e88bfa1>\u003cdiv id=\"janssen-isi-content-wrapper\" data-v-8e88bfa1>\u003cdiv class=\"PONVORY-Consumer\" data-v-8e88bfa1>\u003cdiv class=\"isi-panel-pane\" data-v-8e88bfa1>\u003cdiv class=\"pane-title\" id=\"isi_head\" data-v-8e88bfa1>\u003cp class=\"importantsaf\" data-v-8e88bfa1> IMPORTANT SAFETY INFORMATION \u003c/p>\u003c/div>\u003cdiv class=\"pane-content\" id=\"isi_body_wrapper\" data-v-8e88bfa1>\u003cdiv id=\"isi_body\" data-v-8e88bfa1>\u003cp class=\"whatisthemos\" data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>WHAT IS THE MOST IMPORTANT INFORMATION I SHOULD KNOW ABOUT PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>? \u003c/strong>\u003c/p>\u003cp class=\"ponvorymayca\" data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> may cause serious side effects, including:\u003c/strong>\u003c/p>\u003cul class=\"isi_body_wrapper_ul_1\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>Infections\u003c/strong> - PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> can increase your risk of serious infections that can be life‑threatening and cause death. PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> lowers the number of white blood cells (lymphocytes) in your blood. This will usually go back to normal within 1 to 2 weeks of stopping treatment. Your healthcare provider should review a recent blood test of your white blood cells before you start taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. Call your healthcare provider right away if you have any of these symptoms of an infection during treatment and for 1 to 2 weeks after your last dose of PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>: \u003c/li>\u003c/ul>\u003ctable data-v-8e88bfa1>\u003ctbody data-v-8e88bfa1>\u003ctr data-v-8e88bfa1>\u003ctd data-v-8e88bfa1>\u003cdiv data-v-8e88bfa1>\u003cul class=\"isi_body_wrapper_ul_2\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>fever\u003c/li>\u003cli data-v-8e88bfa1>tiredness\u003c/li>\u003cli data-v-8e88bfa1>body aches\u003c/li>\u003cli data-v-8e88bfa1>chills\u003c/li>\u003cli data-v-8e88bfa1>nausea\u003c/li>\u003c/ul>\u003c/div>\u003c/td>\u003ctd data-v-8e88bfa1>\u003cdiv data-v-8e88bfa1>\u003cul class=\"isi_body_wrapper_ul_3\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>vomiting\u003c/li>\u003cli data-v-8e88bfa1> headache with fever, neck stiffness, sensitivity to light, nausea, or confusion (these may be symptoms of meningitis, an infection of the lining around your brain and spine) \u003c/li>\u003c/ul>\u003c/div>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"yourhealthca\" data-v-8e88bfa1> Your healthcare provider may delay starting or may stop your PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> treatment if you have an infection. \u003c/p>\u003cul class=\"isi_body_wrapper_ul_4\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>Slow heart rate (bradycardia or bradyarrhythmia) when you start taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. \u003c/strong>PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> can cause your heart rate to slow down, especially after you take your first dose. You should have a test to check the electrical activity of your heart called an electrocardiogram (ECG) before you take your first dose. \u003c/li>\u003c/ul>\u003cp class=\"onlystartyou\" data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>Only Start your treatment with PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> using the Starter Pack.\u003c/strong> You must use the PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> Starter Pack by slowly increasing the dose over a 14-day period to help reduce the effect of slowing of your heart rate. It is important to follow the recommended dosing instructions. \u003c/p>\u003cp class=\"callyourheal\" data-v-8e88bfa1> Call your healthcare provider if you experience the following symptoms of slow heart rate: \u003c/p>\u003ctable data-v-8e88bfa1>\u003ctbody data-v-8e88bfa1>\u003ctr data-v-8e88bfa1>\u003ctd data-v-8e88bfa1>\u003cdiv data-v-8e88bfa1>\u003cul class=\"isi_body_wrapper_ul_5\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>dizziness\u003c/li>\u003cli data-v-8e88bfa1>lightheadedness\u003c/li>\u003cli data-v-8e88bfa1> feeling like your heart is beating slowly or skipping beats \u003c/li>\u003c/ul>\u003c/div>\u003c/td>\u003ctd data-v-8e88bfa1>\u003cdiv data-v-8e88bfa1>\u003cul class=\"isi_body_wrapper_ul_6\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>shortness of breath\u003c/li>\u003cli data-v-8e88bfa1>confusion\u003c/li>\u003cli data-v-8e88bfa1>chest pain\u003c/li>\u003cli data-v-8e88bfa1>tiredness\u003c/li>\u003c/ul>\u003c/div>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"donottakepon\" data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>Do not take PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> if you:\u003c/strong>\u003c/p>\u003cul class=\"isi_body_wrapper_ul_7\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1> have had a heart attack, chest pain called unstable angina, stroke or mini‑stroke (transient ischemic attack or TIA), or certain types of heart failure in the last 6 months. \u003c/li>\u003cli data-v-8e88bfa1> have certain types of heart block or irregular or abnormal heartbeat (arrhythmia) unless you have a pacemaker. \u003c/li>\u003c/ul>\u003cp class=\"talktoyourhe\" data-v-8e88bfa1> Talk to your healthcare provider if you have any of these conditions, or do not know if you have any of these conditions. \u003c/p>\u003cp class=\"beforeyoutak\" data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>Before you take PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>, tell your healthcare provider about all your medical conditions, including if you:\u003c/strong>\u003c/p>\u003cul class=\"isi_body_wrapper_ul_8\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1> have a fever or infection, or you are unable to fight infections due to a disease or taking medicines that lower your immune system. \u003c/li>\u003cli data-v-8e88bfa1> have had chicken pox or have received the vaccine for chicken pox. Your healthcare provider may do a blood test for chicken pox virus. You may need to get the full course of vaccine for chicken pox and then wait 1 month before you start taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. \u003c/li>\u003cli data-v-8e88bfa1>have slow heart rate.\u003c/li>\u003cli data-v-8e88bfa1> have an irregular or abnormal heartbeat (arrhythmia). \u003c/li>\u003cli data-v-8e88bfa1>have a history of stroke.\u003c/li>\u003cli data-v-8e88bfa1> have heart problems, including a heart attack or chest pain. \u003c/li>\u003cli data-v-8e88bfa1>have high blood pressure.\u003c/li>\u003cli data-v-8e88bfa1> have breathing problems, including during your sleep (sleep apnea). \u003c/li>\u003cli data-v-8e88bfa1>have liver problems.\u003c/li>\u003cli data-v-8e88bfa1> had or now have a type of skin cancer called basal cell carcinoma (BCC), melanoma, or squamous cell carcinoma \u003c/li>\u003cli data-v-8e88bfa1> have eye problems, especially an inflammation of the eye called uveitis. \u003c/li>\u003cli data-v-8e88bfa1>have diabetes.\u003c/li>\u003cli data-v-8e88bfa1> are pregnant or plan to become pregnant. PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> may harm your unborn baby. Talk with your healthcare provider if you are pregnant or plan to become pregnant. If you are a woman who can become pregnant, you should use effective birth control during your treatment with PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> and for 1 week after you stop taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. Talk to your healthcare provider about what method of birth control is right for you during this time. Tell your healthcare provider right away if you do become pregnant while taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> or within 1 week after you stop taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. \u003c/li>\u003cli data-v-8e88bfa1> are breastfeeding or plan to breastfeed. It is not known if PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> passes into your breast milk. Talk to your healthcare provider about the best way to feed your baby if you take PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. \u003c/li>\u003c/ul>\u003cp class=\"tellyourheal\" data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>Tell your healthcare provider about all the medicines you take, including prescription medicines, over-the-counter medicines, vitamins, and herbal supplements. \u003c/strong>\u003c/p>\u003cp class=\"usingponvory\" data-v-8e88bfa1> Using PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> and other medicines together may affect each other causing serious side effects. Especially tell your healthcare provider if you take or have taken: Medicines to control your heart rhythm (antiarrhythmics), or blood pressure (antihypertensives), or heart-beat (such as calcium channel blockers or beta-blockers); medicines that affect your immune system, such as alemtuzumab. \u003c/p>\u003cp class=\"youshouldnot\" data-v-8e88bfa1> You should not receive \u003cstrong data-v-8e88bfa1>live\u003c/strong> vaccines during treatment with PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>, for at least 1 month before taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>, and for 1 to 2 weeks after you stop taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. If you receive a live vaccine, you may get the infection the vaccine was meant to prevent. Vaccines may not work as well when given during treatment with PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. \u003c/p>\u003cp class=\"talkwithyour\" data-v-8e88bfa1> Talk with your healthcare provider if you are not sure if you take any of these medicines. \u003c/p>\u003cp class=\"howshouldita\" data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>HOW SHOULD I TAKE PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>?\u003c/strong>\u003c/p>\u003cul class=\"isi_body_wrapper_ul_9\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1> Take PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> exactly as your healthcare provider tells you to take it. \u003c/li>\u003cli data-v-8e88bfa1>Take PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> 1 time each day.\u003c/li>\u003cli data-v-8e88bfa1> Swallow PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> tablets whole. \u003c/li>\u003cli data-v-8e88bfa1> Take PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> with or without food. \u003c/li>\u003cli data-v-8e88bfa1> Do not stop taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> without talking with your healthcare provider first. \u003c/li>\u003cli data-v-8e88bfa1>Do not skip a dose.\u003c/li>\u003cli data-v-8e88bfa1> Start taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> with a 14-day starter pack. \u003c/li>\u003cli data-v-8e88bfa1> If you miss taking 1, 2, or 3 tablets in a row of PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> in the 14-day starter pack, continue treatment by taking the first dose you missed. Take 1 tablet as soon as you remember. Then, take 1 tablet a day to continue with the starter pack dose as planned. \u003c/li>\u003cli data-v-8e88bfa1> If you miss taking 1, 2, or 3 tablets in a row of PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> while taking the 20 mg maintenance dose, continue treatment with the 20 mg maintenance dose. \u003c/li>\u003cli data-v-8e88bfa1> If you miss taking 4 or more tablets in a row of PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>, while taking the 14-day starter pack or the 20 mg maintenance dose, you need to restart treatment with a new 14-day starter pack. Call your healthcare provider if you miss 4 or more doses of PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. Do not restart PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> after stopping it for 4 or more days in a row without talking to your healthcare provider. If you have certain heart conditions, you may need to be monitored by your healthcare provider for at least 4 hours when you take your next dose. \u003c/li>\u003c/ul>\u003cp class=\"whatarethepo\" data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>What are the possible side effects of PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>?\u003c/strong>\u003c/p>\u003cp class=\"ponvorymayca\" data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> may cause serious side effects, including:\u003c/strong>\u003c/p>\u003cul class=\"isi_body_wrapper_ul_10\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>breathing problems\u003c/strong>. Some people who take PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> have shortness of breath. Call your healthcare provider right away if you have new or worsening breathing problems. \u003c/li>\u003cli data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>liver problems.\u003c/strong> PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> may cause liver problems. Your healthcare provider should do blood tests to check your liver before you start taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. Call your healthcare provider right away if you have any of the following symptoms of liver problems: \u003c/li>\u003c/ul>\u003ctable data-v-8e88bfa1>\u003ctbody data-v-8e88bfa1>\u003ctr data-v-8e88bfa1>\u003ctd data-v-8e88bfa1>\u003cdiv data-v-8e88bfa1>\u003cul class=\"isi_body_wrapper_ul_11\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>unexplained nausea\u003c/li>\u003cli data-v-8e88bfa1>vomiting\u003c/li>\u003cli data-v-8e88bfa1>stomach (abdominal) pain\u003c/li>\u003cli data-v-8e88bfa1>tiredness\u003c/li>\u003c/ul>\u003c/div>\u003c/td>\u003ctd data-v-8e88bfa1>\u003cdiv data-v-8e88bfa1>\u003cul class=\"isi_body_wrapper_ul_12\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>loss of appetite\u003c/li>\u003cli data-v-8e88bfa1> yellowing of the whites of your eyes or skin \u003c/li>\u003cli data-v-8e88bfa1>dark urine\u003c/li>\u003c/ul>\u003c/div>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cul class=\"isi_body_wrapper_ul_13\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>increased blood pressure.\u003c/strong> Your healthcare provider should check your blood pressure during treatment. \u003c/li>\u003cli data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>types of skin cancer called basal cell carcinoma (BCC), melanoma, and squamous cell carcinoma. \u003c/strong>Certain types of skin cancer have happened with drugs in the same class.\u003cstrong data-v-8e88bfa1>\u003c/strong>Tell your healthcare provider if you have any changes in the appearance of your skin, including changes in a mole, a new darkened area on your skin, a sore that does not heal, or growths on your skin, such as a bump that may be shiny, pearly white, skin-colored, or pink. Your doctor should check your skin for any changes at the start of and during treatment with PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. Limit the amount of time you spend in sunlight and ultraviolet (UV) light. Wear protective clothing and use a sunscreen with a high sun protection factor. \u003c/li>\u003cli data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>a problem with your vision called macular edema.\u003c/strong> Tell your healthcare provider about any changes in your vision. Your healthcare provider should test your vision around the time you start taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>, periodically while you continue taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>, and any time you notice vision changes during treatment with PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. Your risk of macular edema is higher if you have diabetes or have had an inflammation of your eye called uveitis. \u003c/li>\u003c/ul>\u003cp class=\"callyourheal pb-4\" data-v-8e88bfa1> Call your healthcare provider right away if you have any of the following symptoms: \u003c/p>\u003ctable data-v-8e88bfa1>\u003ctbody data-v-8e88bfa1>\u003ctr data-v-8e88bfa1>\u003ctd data-v-8e88bfa1>\u003cdiv data-v-8e88bfa1>\u003cul class=\"isi_body_wrapper_ul_14\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1> blurriness or shadows in the center of your vision \u003c/li>\u003cli data-v-8e88bfa1> a blind spot in the center of your vision \u003c/li>\u003c/ul>\u003c/div>\u003c/td>\u003ctd data-v-8e88bfa1>\u003cdiv data-v-8e88bfa1>\u003cul class=\"isi_body_wrapper_ul_15\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>sensitivity to light\u003c/li>\u003cli data-v-8e88bfa1> unusually colored (tinted) vision \u003c/li>\u003c/ul>\u003c/div>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cul class=\"isi_body_wrapper_ul_16\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>swelling and narrowing of the blood vessels in your brain\u003c/strong>. A condition called Posterior Reversible Encephalopathy Syndrome (PRES) has happened with drugs in the same class. Symptoms of PRES usually get better when you stop taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. However, if left untreated, it may lead to a stroke. Call your healthcare provider right away if you have any of the following symptoms: \u003c/li>\u003c/ul>\u003ctable data-v-8e88bfa1>\u003ctbody data-v-8e88bfa1>\u003ctr data-v-8e88bfa1>\u003ctd data-v-8e88bfa1>\u003cdiv data-v-8e88bfa1>\u003cul class=\"isi_body_wrapper_ul_17\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>sudden severe headache\u003c/li>\u003cli data-v-8e88bfa1>sudden confusion\u003c/li>\u003c/ul>\u003c/div>\u003c/td>\u003ctd data-v-8e88bfa1>\u003cdiv data-v-8e88bfa1>\u003cul class=\"isi_body_wrapper_ul_18\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1> sudden loss of vision or other changes in vision \u003c/li>\u003cli data-v-8e88bfa1>seizure\u003c/li>\u003c/ul>\u003c/div>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cul class=\"isi_body_wrapper_ul_19\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>severe worsening of multiple sclerosis (MS) after stopping PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. \u003c/strong>When PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> is stopped, symptoms of MS may return and become worse compared to before or during treatment. Always talk to your healthcare provider before you stop taking PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> for any reason. Tell your healthcare provider if you have worsening symptoms of MS after stopping PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. \u003c/li>\u003c/ul>\u003cp class=\"themostcommo\" data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>The most common side effects of PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup> include:\u003c/strong>\u003c/p>\u003cul class=\"isi_body_wrapper_ul_20\" data-v-8e88bfa1>\u003cli data-v-8e88bfa1>upper respiratory tract infections\u003c/li>\u003cli data-v-8e88bfa1> elevated liver enzymes (abnormal liver tests) \u003c/li>\u003cli data-v-8e88bfa1>high blood pressure (hypertension)\u003c/li>\u003c/ul>\u003cp class=\"thesearenota\" data-v-8e88bfa1> These are not all the possible side effects of PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>. For more information, ask your healthcare provider or pharmacist. See “What is the most important information I should know about PONVORY\u003csup data-v-8e88bfa1>®\u003c/sup>?” \u003c/p>\u003cp class=\"tellyourdoct\" data-v-8e88bfa1> Tell your doctor if you have any side effect that bothers you or that does not go away. \u003c/p>\u003cp class=\"callyourdoct\" data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>Call your doctor for medical advice about side effects. You are also encouraged to report side effects to the FDA: visit \u003c/strong>\u003ca href=\"https://www.fda.gov/medwatch\" target=\"_blank\" class=\"extlink\" data-v-8e88bfa1>http://www.fda.gov/medwatch\u003c/a>\u003cstrong data-v-8e88bfa1> or call 1-800-FDA-1088. \u003c/strong>You may also report side effects to Vanda Pharmaceuticals, Inc at 1-833-933-9331. \u003c/p>\u003cp class=\"pleaseseeful\" data-v-8e88bfa1>\u003cstrong data-v-8e88bfa1>Please see full \u003c/strong>\u003ca href=\"https://assets.vandapharma.com/Ponvory/ponvory_prescribing_information.pdf\" target=\"_blank\" data-v-8e88bfa1>Prescribing Information\u003c/a>\u003cstrong data-v-8e88bfa1> and \u003c/strong>\u003ca href=\"https://assets.vandapharma.com/Ponvory/ponvory_medication_guide.pdf\" target=\"_blank\" data-v-8e88bfa1>Medication Guide\u003c/a>\u003cstrong data-v-8e88bfa1>.\u003c/strong>\u003c/p>\u003cp class=\"trademarksar\" data-v-8e88bfa1> Trademarks are those of their respective owners. \u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003c/div>\u003cdiv class=\"block lg:hidden pt-8\">\u003cbutton type=\"button\" class=\"inline-flex px-3 py-2 rounded-md text-[01af99]\" style=\"\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" class=\"-ml-0.5 mr-2 h-12 w-16\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\">\u003cpath strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth=\"{2}\" d=\"M12 4v16m8-8H4\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"lg:max-h-full z-10 overflow-hidden col-span-1 order-1 lg:order-2 lg:col-span-1 flex pt-5 2xs:pl-12 2xs:pr-6 lg:px-0 max-h-48\" style=\"margin-left:0 !important;\">\u003cdiv class=\"isi-panel-pane\" id=\"indication\">\u003cdiv class=\"pane-title\" id=\"head-indication\">\u003cp class=\"whatisponvor wip\">WHAT IS PONVORY\u003csup>®\u003c/sup>?\u003c/p>\u003c/div>\u003cdiv class=\"pane-content\" id=\"body-indication\">\u003cp class=\"ponvoryisapr wip-content\"> PONVORY\u003csup>®\u003c/sup> is a prescription medicine that is used to treat relapsing forms of multiple sclerosis, to include clinically isolated syndrome, relapsing-remitting disease, and active secondary progressive disease, in adults. \u003c/p>\u003cp class=\"itisnotknown wip-content my-4\"> It is not known if PONVORY\u003csup>®\u003c/sup> is safe and effective in children. \u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"block lg:hidden\">\u003cbutton type=\"button\" class=\"inli le text (usually URLs) found in:\n    1. The footer\n    2. .lh-node (outerHTML)\n    3. .lh-code\n\n  With that sorted, the next challenge is appropriate column sizing and text wrapping inside our\n  .lh-details tables. Even more fun.\n    * We don\'t want table headers ("Potential Savings (ms)") to wrap or their column values, but\n    we\'d be happy for the URL column to wrap if the URLs are particularly long.\n    * We want the narrow columns to remain narrow, providing the most column width for URL\n    * We don\'t want the table to extend past 100% width.\n    * Long URLs in the URL column can wrap. Util.getURLDisplayName maxes them out at 64 characters,\n      but they do not get any overflow:ellipsis treatment.\n  */\n  word-break: break-word;\n}\n\n.lh-audit-group a,\n.lh-category-header__description a,\n.lh-audit__description a,\n.lh-warnings a,\n.lh-footer a,\n.lh-table-column--link a {\n  color: var(--color-informative);\n}\n\n.lh-audit__description, .lh-audit__stackpack {\n  --inner-audit-padding-right: var(--stackpack-padding-horizontal);\n  padding-left: var(--audit-description-padding-left);\n  padding-right: var(--inner-audit-padding-right);\n  padding-top: 8px;\n  padding-bottom: 8px;\n}\n\n.lh-details {\n  font-size: var(--report-font-size);\n  margin-top: var(--default-padding);\n  margin-bottom: var(--default-padding);\n  margin-left: var(--audit-description-padding-left);\n  /* whatever the .lh-details side margins are */\n  width: 100%;\n}\n\n.lh-audit__stackpack {\n  display: flex;\n  align-items: center;\n}\n\n.lh-audit__stackpack__img {\n  max-width: 50px;\n  margin-right: var(--default-padding)\n}\n\n/* Report header */\n\n.lh-report-icon {\n  display: flex;\n  align-items: center;\n  padding: 10px 12px;\n  cursor: pointer;\n}\n.lh-report-icon[disabled] {\n  opacity: 0.3;\n  pointer-events: none;\n}\n\n.lh-report-icon::before {\n  content: "";\n  margin-right: 5px;\n  background-repeat: no-repeat;\n  width: var(--report-icon-size);\n  heig pet-color);\n  font-size: var(--report-monospace-font-size);\n  line-height: 20px;\n}\n\n/* Score */\n\n.lh-audit__score-icon {\n  width: var(--score-icon-size);\n  height: var(--score-icon-size);\n  margin: var(--score-icon-margin);\n}\n\n.lh-audit--pass .lh-audit__display-text {\n  color: var(--color-pass-secondary);\n}\n.lh-audit--pass .lh-audit__score-icon,\n.lh-scorescale-range--pass::before {\n  border-radius: 100%;\n  background: var(--color-pass);\n}\n\n.lh-audit--average .lh-audit__display-text {\n  color: var(--color-average-secondary);\n}\n.lh-audit--average .lh-audit__score-icon,\n.lh-scorescale-range--average::before {\n  background: var(--color-average);\n  width: var(--icon-square-size);\n  height: var(--icon-square-size);\n}\n\n.lh-audit--fail .lh-audit__display-text {\n  color: var(--color-fail-secondary);\n}\n.lh-audit--fail .lh-audit__score-icon,\n.lh-audit--error .lh-audit__score-icon,\n.lh-scorescale-range--fail::before {\n  border-left: calc(var(--score-icon-size) / 2) solid transparent;\n  border-right: calc(var(--score-icon-size) / 2) solid transparent;\n  border-bottom: var(--score-icon-size) solid var(--color-fail);\n}\n\n.lh-audit--manual .lh-audit__display-text,\n.lh-audit--notapplicable .lh-audit__display-text {\n  color: var(--color-gray-600);\n}\n.lh-audit--manual .lh-audit__score-icon,\n.lh-audit--notapplicable .lh-audit__score-icon {\n  border: 2px solid var(--color-gray-400);\n  border-radius: 100%;\n  background: none;\n}\n\n.lh-audit--informative .lh-audit__display-text {\n  color: var(--color-gray-600);\n}\n\n.lh-audit--informative .lh-audit__score-icon {\n  border: 2px solid var(--color-gray-400);\n  border-radius: 100%;\n}\n\n.lh-audit__description,\n.lh-audit__stackpack {\n  color: var(--report-text-color-secondary);\n}\n.lh-audit__adorn {\n  border: 1px solid slategray;\n  border-radius: 3px;\n  margin: 0 3px;\n  padding: 0 2px;\n  line-height: 1.1;\n  display: inline-block;\n  font-size: 90%;\n}\n\n.lh-category-header__description  {\n  font-size: var(--report-font-size);\n  text-align: center;\n  margin: 0px auto;\n  max-width: 400px;\n}\n\n\n.lh-audit__display-text,\n.lh-load-opportunity__sparkline,\n.lh-chevron-container {\n  margin: 0 var(--audit-margin-horizontal);\n}\n.lh-chevron-container {\n  margin-right: 0;\n}\n\n.lh-audit__title-and-text {\n  flex: 1;\n}\n\n.lh-audit__title-and-text code {\n  color: var(--snippet-color);\n  font-size: var(--report-monospace-font-size);\n}\n\n/* Prepend display text with em dash separator. But not in Opportunities. */\n.lh-audit__display-text:not(:empty):before {\n  content: \'—\';\n  margin-right: var(--audit-margin-horizontal);\n}\n.lh-audit-group.lh-audit-group--load-opportunities .lh-audit__display-text:not(:empty):before {\n  display: none;\n}\n\n/* Expandable Details (Audit Groups, Audits) */\n.lh-audit__header {\n  display: flex;\n  align-items: center;\n  font-weight: 500;\n  padding: var(--audit-padding-vertical) 0;\n}\n\n.lh-audit--load-opportunity .lh-audit__header {\n  display: block;\n}\n\n\n.lh-metricfilter {\n  text-align: right;\n  margin-top: var(--default-padding);\n}\n\n.lh-metricfilter__radio {\n  position: absolute;\n  left: -9999px;\n}\n.lh-metricfilter input[type=\'radio\']:focus-visible + label {\n  outline: -webkit-focus-ring-color auto 1px;\n}\n\n.lh-metricfilter__label {\n  border: solid 1px var(--color-gray-400);\n  align-items: center;\n  justify-content: center;\n  padding: 2px 5px;\n  width: 50%;\n  height: 28px;\n  cursor: pointer;\n  font-size: 90%;\n}\n\n.lh-metricfilter__label:first-of-type {\n  border-top-left-radius: 5px;\n  border-bottom-left-radius: 5px;\n  margin-left: 5px;\n}\n.lh-metricfilter__label:last-of-type {\n  border-top-right-radius: 5px;\n  border-bottom-right-radius: 5px;\n}\n\n.lh-metricfilter__label--active {\n  background: var(--color-blue-A700);\n  color: var(--color-white);\n}\n/* Give the \'All\' choice a more muted display */\n.lh-metricfilter__label--active[for="metric-All"] {\n  background-color: var(--color-blue-200) !important;\n  color: black !important;\n}\n\n/* If audits are filtered, hide the itemcount for Passed Audits… */\n.lh-category--filtered .lh-audit-group .lh-audit-group__itemcount {\n  display: none;\n}\n\n\n.lh-audit__header:hover {\n  background-color: var(--color-hover);\n}\n\n/* We want to hide the browser\'s default arrow marker on summary elements. Admittedly, it\'s complicated. */\n.lh-audit-group > summary,\n.lh-expandable-details > summary {\n  /* Blink 89+ and Firefox will hide the arrow when display is changed from (new) default of `list-item` to block.  https://chromestatus.com/feature/6730096436051968*/\n  display: block;\n}\n/* Safari and Blink <=88 require using the -webkit-details-marker selector */\n.lh-audit-group > summary::-webkit-details-marker,\n.lh-expandable-details > summary::-webkit-details-marker {\n  display: none;\n}\n\n/* Perf Metric */\n\n.lh-metrics-container {\n  display: grid;\n  grid-template-rows: 1fr 1fr 1fr;\n  grid-auto-flow: column;\n  grid-column-gap: 24px;\n}\n\n.lh-metric {\n  border-top: 1px solid var(--report-border-color-secondary);\n}\n\n@media screen and (min-width: 640px) {\n  .lh-metric:nth-child(3n+3) {\n    border-bottom: 1px solid var(--report-border-color-secondary);\n  }\n}\n\n@media screen and (max-width: 640px) {\n  .lh-metrics-container {\n    display: block;\n  }\n\n  .lh-metric:nth-last-child(-n+1) {\n    border-bottom: 1px solid var(--report-border-color-secondary);\n  }\n}\n\n.lh-metric__innerwrap {\n  display: grid;\n  /**\n   * Icon -- Metric Name\n   *      -- Metric Value\n   */\n  grid-template-columns: calc(var(--score-icon-size) + var(--score-icon-margin-left) + var(--score-icon-margin-right)) 1fr;\n  align-items: center;\n  padding: 10px 0;\n}\n\n.lh-metric__details {\n  order: -1;\n}\n\n.lh-metric__title {\n  flex: 1;\n  font-weight: 500;\n}\n\n.lh-metrics__disclaimer {\n  color: var(--color-gray-600);\n  margin: var(--section-padding-vertical) 0;\n}\n\n.lh-calclink {\n  padding-left: calc(1ex / 3);\n}\n\n.lh-metric__description {\n  display: none;\n  grid-column-start: 2;\n  grid-column-end: 4;\n  color: var(--report-text-color-secondary);\n}\n\n.lh-metric__value {\n  font-size: var(--metric-value-font-size);\n  margin: calc(var(--default-padding) / 2) 0;\n  white-space: nowrap; /* No wrapping between metric value and the icon */\n  font-weight: 500;\n  grid-column-start: 2;\n}\n\n/* Change the grid to 3 columns for narrow viewport. */\n@media screen and (max-width: 535px) {\n  .lh-metric__innerwrap {\n  /**\n   * Icon -- Metric Name -- Metric Value\n   */\n    grid-template-columns: calc(var(--score-icon-size) + var(--score-icon-margin-left) + var(--score-icon-margin-right)) 2fr 1fr;\n  }\n  .lh-metric__value {\n    justify-self: end;\n    grid-column-start: unset;\n  }\n}\n\n/* No-JS toggle switch */\n/* Keep this selector sync\'d w/ `magicSelector` in report-ui-features-test.js */\n .lh-metrics-toggle__input:checked ~ .lh-metrics-container .lh-metric__description {\n  display: block;\n}\n\n.lh-metrics-toggle__input {\n  cursor: pointer;\n  opacity: 0;\n  position: absolute;\n  right: 0;\n  width: 74px;\n  height: 28px;\n  top: -3px;\n}\n.lh-metrics-toggle__label {\n  display: flex;\n  background-color: #eee;\n  border-radius: 20px;\n  overflow: hidden;\n  position: absolute;\n  right: 0;\n  top: -3px;\n  pointer-events: none;\n}\n.lh-metrics-toggle__input:focus + label {\n  outline: -webkit-focus-ring-color auto 3px;\n}\n.lh-metrics-toggle__icon {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 2px 5px;\n  width: 50%;\n  height: 28px;\n}\n.lh-metrics-toggle__input:not(:checked) + label .lh-metrics-toggle__icon--less,\n.lh-metrics-toggle__input:checked + label .lh-metrics-toggle__icon--more {\n  background-color: var(--color-blue-A700);\n  --metric-toggle-lines-fill: var(--color-white);\n}\n.lh-metrics-toggle__lines {\n  fill: var(--metric-toggle-lines-fill);\n}\n\n.lh-metrics-toggle
