avigation\u003c/span>\u003cspan class=\"icon-bar\">\u003c/span>\u003cspan class=\"icon-bar\">\u003c/span>\u003cspan class=\"icon-bar\">\u003c/span>\u003c/button>","message":"Syntax not understood"},{"index":"101","line":"            \u003ca class=\"navbar-brand\" href=\"/\">\u003cimg src=\"/Content/img/logo.png\" alt=\"Prograf (tacrolimus) logo\" />\u003c/a>","message":"Syntax not understood"},{"index":"102","line":"        \u003c/div>","message":"Syntax not understood"},{"index":"103","line":"        \u003c!-- Collect the nav links, forms, and other content for toggling -->","message":"Syntax not understood"},{"index":"104","line":"        \u003cdiv class=\"collapse navbar-collapse\" id=\"mainNav\">","message":"Syntax not understood"},{"index":"105","line":"            \u003cul class=\"nav navbar-nav navbar-right\">","message":"Syntax not understood"},{"index":"106","line":"                \u003cli >\u003ca href=\"/about\">About PROGRAF\u003c/a>\u003c/li>","message":"Syntax not understood"},{"index":"107","line":"                \u003cli >\u003ca href=\"/discuss\">At the Healthcare Provider\u003c/a>\u003c/li>","message":"Syntax not understood"},{"index":"108","line":"                \u003cli >\u003ca href=\"/dosing\">Taking PROGRAF\u003c/a>\u003c/li>","message":"Syntax not understood"},{"index":"109","line":"                \u003cli >\u003ca href=\"/side-effects\">Side Effects\u003c/a>\u003c/li>","message":"Syntax not understood"},{"index":"111","line":"\t\t\t\t\u003cli class=\"mobile-nav-add hidden-sm hidden-md hidden-lg\">\u003ca href=\"https://www.astellas.com/us/system/files/prograf_7.pdf\" target=\"_blank\" rel=\"noreferrer\">Prescribing Information\u003c/a>\u003c/li>","message":"Unknown directive"},{"index":"112","line":"\t\t\t\t\u003cli class=\"mobile-nav-add hidden-sm hidden-md hidden-lg\">\u003ca href=\"https://www.astellas.com/us/system/files/prografwpi_3.pdf\" target=\"_blank\" rel=\"noreferrer\">Patient Information\u003c/a>\u003c/li>","message":"Unknown directive"},{"index":"113","line":"\t\t\t\t\u003cli class=\"mobile-nav-add hidden-sm hidden-md hidden-lg\">\u003ca href=\"https://astellascares.com\" target=\"_blank\" rel=\"noreferrer\">Astellas Cares&trade;\u003c/a>\u003c/li>","message":"Unknown directive"},{"index":"114","line":"            \u003c/ul>","message":"Syntax not understood"},{"index":"115","line":"        \u003c/div>","message":"Syntax not understood"},{"index":"116","line":"        \u003c!-- /.navbar-collapse -->","message":"Syntax not understood"},{"index":"117","line":"    \u003c/div>","message":"Syntax not understood"},{"index":"118","line":"\u003c/nav>","message":"Syntax not understood"},{"index":"121","line":"\u003cdiv class=\"white-bg\">","message":"Syntax not understood"},{"index":"122","line":"    \u003ch1>An error has occurred.\u003c/h1>","message":"Syntax not understood"},{"index":"123","line":"    \u003cp>Please return to the \u003ca href=\"/\">home page\u003c/a>.\u003c/p>","message":"Syntax not understood"},{"index":"124","line":"\u003c/div>","message":"Syntax not understood"},{"index":"126","line":"\u003cdiv id=\"isi-top\" class=\"container isi-container isi\">","message":"Syntax not understood"},{"index":"127","line":"    \u003cdiv class=\"row\">","message":"Syntax not understood"},{"index":"128","line":"        \u003cdiv class=\"col-xs-12\">","message":"Syntax not understood"},{"index":"129","line":"            \u003cp class=\"title dark-blue-text high-padding-bottom\">What is PROGRAF?\u003c/p>","message":"Syntax not understood"},{"index":"130","line":"\u003cul class=\"padded-list no-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"131","line":"    \u003cli>PROGRAF is a prescription medicine used with other medicines to help prevent organ rejection in people who have had a kidney, liver, heart, or lung transplant.\u003c/li>","message":"Syntax not understood"},{"index":"132","line":"    \u003cli>PROGRAF capsules and PROGRAF Granules are types of tacrolimus immediate-release drugs and they are not the same as tacrolimus extended-release tablets or tacrolimus extended-release capsules. Your healthcare provider should decide what medicine is right for you.\u003c/li>","message":"Syntax not understood"},{"index":"133","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"135","line":"\u003cp class=\"title dark-blue-text\">IMPORTANT SAFETY INFORMATION\u003c/p>","message":"Syntax not understood"},{"index":"137","line":"\u003cp class=\"title dark-blue-text\">What is the most important information I should know about PROGRAF?\u003c/p>","message":"Syntax not understood"},{"index":"138","line":"\u003cp class=\"title\" style=\"padding-top:0;\">PROGRAF can cause serious side effects, including:\u003c/p>","message":"Unknown directive"},{"index":"139","line":"\u003cul class=\"no-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"140","line":"    \u003cli>\u003cstrong>Increased risk of cancer.\u003c/strong> People who take PROGRAF have an increased risk of getting some kinds of cancer, including skin and lymph gland cancer (lymphoma).\u003c/li>","message":"Syntax not understood"},{"index":"141","line":"    \u003cli>","message":"Syntax not understood"},{"index":"142","line":"        \u003cstrong>Increased risk of infection.\u003c/strong> PROGRAF is a medicine that affects your immune system. PROGRAF can lower the ability of your immune system to fight infections. Serious infections can happen in people receiving PROGRAF that can cause death. \u003cstrong>Call your healthcare provider right away if you have any symptoms of an infection, including\u003c/strong>:\u003cbr />","message":"Unknown directive"},{"index":"143","line":"        \u003cul class=\"two-col-list left-padded\">","message":"Syntax not understood"},{"index":"144","line":"            \u003cli>fever\u003c/li>","message":"Syntax not understood"},{"index":"145","line":"            \u003cli>muscle aches\u003c/li>","message":"Syntax not understood"},{"index":"146","line":"            \u003cli>sweats or chills\u003c/li>","message":"Syntax not understood"},{"index":"147","line":"            \u003cli>warm, red, or painful areas on your skin\u003c/li>","message":"Syntax not understood"},{"index":"148","line":"            \u003cli>cough or flu-like symptoms\u003c/li>","message":"Syntax not understood"},{"index":"149","line":"        \u003c/ul>","message":"Syntax not understood"},{"index":"150","line":"    \u003c/li>    ","message":"Syntax not understood"},{"index":"151","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"153","line":"\u003cp>\u003cstrong>Do not take PROGRAF if you\u003c/strong> are allergic to tacrolimus or any of the ingredients in PROGRAF.\u003c/p>","message":"Syntax not understood"},{"index":"155","line":"\u003cp class=\"title dark-blue-text\">What should I tell my healthcare provider before taking PROGRAF?\u003c/p>","message":"Syntax not understood"},{"index":"156","line":"\u003cp style=\"padding-top:0;\">","message":"Unknown directive"},{"index":"157","line":"    \u003cstrong>Before you take PROGRAF, tell your healthcare provider about all of your medical conditions, including if you:\u003c/strong>","message":"Unknown directive"},{"index":"158","line":"    \u003cul class=\"left-padded\">","message":"Syntax not understood"},{"index":"159","line":"        \u003cli>plan to receive any vaccines (people taking PROGRAF should not receive live vaccines)\u003c/li>","message":"Syntax not understood"},{"index":"160","line":"        \u003cli>have or have had liver, kidney, heart, or lung problems\u003c/li>","message":"Syntax not understood"},{"index":"161","line":"        \u003cli>","message":"Syntax not understood"},{"index":"162","line":"            are pregnant or plan to become pregnant. PROGRAF can harm your unborn baby.","message":"Syntax not understood"},{"index":"163","line":"            \u003cul class=\"no-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"164","line":"                \u003cli>If you are able to become pregnant, you should use effective birth control before and during treatment with PROGRAF. Talk to your healthcare provider before starting treatment with PROGRAF about birth control methods that may be right for you.\u003c/li>","message":"Syntax not understood"},{"index":"165","line":"                \u003cli>Males who have female partners who are able to become pregnant should also use effective birth control before and during treatment with PROGRAF. Talk to your healthcare provider before starting treatment with PROGRAF about birth control methods that may be right for you.\u003c/li>","message":"Syntax not understood"},{"index":"166","line":"            \u003c/ul>","message":"Syntax not understood"},{"index":"167","line":"        \u003c/li>","message":"Syntax not understood"},{"index":"168","line":"        \u003cli>are breastfeeding or plan to breastfeed. PROGRAF passes into your breast milk. You and your healthcare provider should decide if you will breastfeed while taking PROGRAF.\u003c/li>","message":"Syntax not understood"},{"index":"169","line":"        \u003cli>plan to have children. PROGRAF may affect the ability to have children in females and males (fertility problems).\u003c/li>","message":"Syntax not understood"},{"index":"170","line":"    \u003c/ul>","message":"Syntax not understood"},{"index":"171","line":"\u003c/p>","message":"Syntax not understood"},{"index":"173","line":"\u003cp>","message":"Syntax not understood"},{"index":"174","line":"    \u003cstrong>Tell your healthcare provider about all the medicines you take, and when you start a new medicine or stop taking a medicine,\u003c/strong>","message":"Syntax not understood"},{"index":"175","line":"    including prescription and over-the-counter medicines, vitamins, natural, herbal, or nutritional supplements. \u003cstrong>Especially tell your healthcare provider if you take:\u003c/strong>","message":"Unknown directive"},{"index":"176","line":"\u003c/p>","message":"Syntax not understood"},{"index":"177","line":"\u003cdiv class=\"two-col-list-container\">","message":"Syntax not understood"},{"index":"178","line":"    \u003cdiv class=\"two-col-list\">","message":"Syntax not understood"},{"index":"179","line":"        \u003cdiv class=\"fixed-height\">sirolimus (RAPAMUNE\u003csup>&reg;\u003c/sup>): You should not take PROGRAF if you take sirolimus.\u003c/div>","message":"Unknown directive"},{"index":"180","line":"        \u003cdiv class=\"fixed-height\">cyclosporine (GENGRAF\u003csup>&reg;\u003c/sup>, NEORAL\u003csup>&reg;\u003c/sup>, and SANDIMMUNE\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"181","line":"        \u003cdiv class=\"fixed-height\">medicines called aminoglycosides that are used to treat bacterial infections\u003c/div>","message":"Syntax not understood"},{"index":"182","line":"        \u003cdiv class=\"fixed-height\">ganciclovir (CYTOVENE\u003csup>&reg;\u003c/sup> IV, VALCYTE\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"183","line":"        \u003cdiv class=\"fixed-height\">amphotericin B (ABELCET\u003csup>&reg;\u003c/sup>, AMBISOME\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"184","line":"        \u003cdiv class=\"fixed-height\">cisplatin\u003c/div>","message":"Syntax not understood"},{"index":"185","line":"        \u003cdiv class=\"fixed-height\">antiviral medicines called nucleoside reverse transcriptase inhibitors\u003c/div>","message":"Syntax not understood"},{"index":"186","line":"        \u003cdiv class=\"fixed-height\">antiviral medicines called protease inhibitors\u003c/div>","message":"Syntax not understood"},{"index":"187","line":"        \u003cdiv class=\"fixed-height\">water pill (diuretic)\u003c/div>","message":"Syntax not understood"},{"index":"188","line":"        \u003cdiv class=\"fixed-height\">medicine to treat high blood pressure\u003c/div>","message":"Syntax not understood"},{"index":"189","line":"        \u003cdiv class=\"fixed-height\">nelfinavir (VIRACEPT\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"190","line":"        \u003cdiv class=\"fixed-height\">telaprevir (INCIVEK\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"191","line":"    \u003c/div>","message":"Syntax not understood"},{"index":"192","line":"    \u003cdiv class=\"two-col-list\">","message":"Syntax not understood"},{"index":"193","line":"        \u003cdiv class=\"fixed-height\">boceprevir\u003c/div>","message":"Syntax not understood"},{"index":"194","line":"        \u003cdiv class=\"fixed-height\">ritonavir (KALETRA\u003csup>&reg;\u003c/sup>, NORVIR\u003csup>&reg;\u003c/sup>, TECHNIVIE\u003csup>TM\u003c/sup>, VIEKIRA PAK\u003csup>&reg;\u003c/sup>, VIEKIRA XR\u003csup>TM\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"195","line":"        \u003cdiv class=\"fixed-height\">letermovir (PREVYMIS\u003csup>TM\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"196","line":"        \u003cdiv class=\"fixed-height\">ketoconazole\u003c/div>","message":"Syntax not understood"},{"index":"197","line":"        \u003cdiv class=\"fixed-height\">itraconazole (ONMEL\u003csup>&reg;\u003c/sup>, SPORANOX\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"198","line":"        \u003cdiv class=\"fixed-height\">voriconazole (VFEND\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"199","line":"        \u003cdiv class=\"fixed-height\">caspofungin (CANCIDAS\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"200","line":"        \u003cdiv class=\"fixed-height\">clarithromycin (BIAXIN\u003csup>&reg;\u003c/sup>, BIAXIN\u003csup>&reg;\u003c/sup> XL, PREVPAC\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"201","line":"        \u003cdiv class=\"fixed-height\">rifampin (RIFADIN\u003csup>&reg;\u003c/sup>, RIFAMATE\u003csup>&reg;\u003c/sup>, RIFATER\u003csup>&reg;\u003c/sup>, RIMACTANE\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"202","line":"        \u003cdiv class=\"fixed-height\">rifabutin (MYCOBUTIN\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"203","line":"        \u003cdiv class=\"fixed-height\">amiodarone (NEXTERONE\u003csup>&reg;\u003c/sup>, PACERONE\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"204","line":"        \u003cdiv class=\"fixed-height\">cannabidiol (EPIDIOLEX\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"205","line":"    \u003c/div>","message":"Syntax not understood"},{"index":"206","line":"\u003c/div>","message":"Syntax not understood"},{"index":"207","line":"\u003cdiv style=\"clear:both\">\u003c/div>","message":"Unknown directive"},{"index":"208","line":"\u003cp>Ask your healthcare provider or pharmacist if you are not sure if you take any of the medicines listed above. PROGRAF may affect the way other medicines work, and other medicines may affect how PROGRAF works. Know the medicines you take. Keep a list of your medicines and show it to your healthcare provider and pharmacist when you get a new medicine.\u003c/p>","message":"Syntax not understood"},{"index":"209","line":"\u003cp class=\"title dark-blue-text\">How Should I Take PROGRAF?\u003c/p>","message":"Syntax not understood"},{"index":"210","line":"\u003cul class=\"low-padding-bottom left-padded\">    ","message":"Syntax not understood"},{"index":"211","line":"    \u003cli>Take PROGRAF exactly as your healthcare provider tells you to take it.\u003c/li>","message":"Syntax not understood"},{"index":"212","line":"    \u003cli>Your healthcare provider may change your PROGRAF dose if needed. \u003cstrong>Do not\u003c/strong> stop taking or change your dose of PROGRAF without talking to your healthcare provider.\u003c/li>","message":"Syntax not understood"},{"index":"213","line":"    \u003cli>Take PROGRAF with or without food, the same way every day. For example, if you choose to take PROGRAF with food, you should always take PROGRAF with food.\u003c/li>","message":"Syntax not understood"},{"index":"214","line":"    \u003cli>Take PROGRAF at the same time each day, 12 hours apart. For example, if you take your first dose at 7:00 a.m., you should take your second dose at 7:00 p.m. Taking PROGRAF at the same time each day helps to keep the amount of medicine in your body at a steady level.\u003c/li>","message":"Unknown directive"},{"index":"215","line":"    \u003cli>If you take too much PROGRAF, call your healthcare provider or go to the nearest hospital emergency room right away.\u003c/li>","message":"Syntax not understood"},{"index":"216","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"218","line":"\u003cp class=\"title no-padding-top\">PROGRAF capsules:\u003c/p>","message":"Unknown directive"},{"index":"219","line":"\u003cul class=\"low-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"220","line":"    \u003cli>\u003cstrong>Do not\u003c/strong> open or crush PROGRAF capsules.\u003c/li>","message":"Syntax not understood"},{"index":"221","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"223","line":"\u003cp class=\"title no-padding-top\">PROGRAF Granules:\u003c/p>","message":"Unknown directive"},{"index":"224","line":"\u003cul class=\"low-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"225","line":"    \u003cli>Children who have trouble swallowing capsules can be given PROGRAF Granules.\u003c/li>","message":"Syntax not understood"},{"index":"226","line":"    \u003cli>Give the dose of PROGRAF Granules right after preparing. Do not save prepared PROGRAF Granules as a liquid to take at a later time.\u003c/li>","message":"Syntax not understood"},{"index":"227","line":"    \u003cli>\u003cstrong>See the \u003ca href=\"https://www.astellas.com/us/system/files/prografinstructionstouse_2.pdf\" target=\"_blank\" rel=\"noreferrer\">Instructions for Use\u003c/a> at the end of the Patient Information\u003c/strong> for detailed instructions about how to mix and give PROGRAF Granules as a liquid.\u003c/li>","message":"Unknown directive"},{"index":"228","line":"    \u003cli>If you get the granules or prepared oral suspension on your skin, wash the area well with soap and water.\u003c/li>","message":"Syntax not understood"},{"index":"229","line":"    \u003cli>If you get the granules or prepared oral suspension in your eyes, rinse with plain water.\u003c/li>","message":"Syntax not understood"},{"index":"230","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"232","line":"\u003cp class=\"title dark-blue-text\">What should I avoid while taking PROGRAF?\u003c/p>","message":"Syntax not understood"},{"index":"233","line":"\u003cul class=\"low-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"234","line":"    \u003cli>While you take PROGRAF you should not receive any live vaccines.\u003c/li>","message":"Syntax not understood"},{"index":"235","line":"    \u003cli>Limit the amount of time you spend in sunlight and avoid exposure to ultraviolet (UV) light, such as tanning machines. Wear protective clothing and use a sunscreen with a high sun protection factor (SPF).\u003c/li>","message":"Syntax not understood"},{"index":"236","line":"    \u003cli>\u003cstrong>Do not\u003c/strong> eat grapefruit or drink grapefruit juice during treatment with PROGRAF.\u003c/li>","message":"Syntax not understood"},{"index":"237","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"239","line":"\u003cp class=\"title dark-blue-text\">PROGRAF may cause serious side effects, including:\u003c/p>","message":"Unknown directive"},{"index":"240","line":"\u003cul class=\"low-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"241","line":"    \u003cli>See  \u003cstrong>\"What is the most important information I should know about PROGRAF?\"\u003c/strong>\u003c/li>","message":"Syntax not understood"},{"index":"242","line":"    \u003cli>\u003cstrong>problems from medicine errors.\u003c/strong> People who take PROGRAF have sometimes been given the wrong type of tacrolimus product. \u003cstrong>Tacrolimus extended-release medicines are not the same as PROGRAF capsules or granules\u003c/strong> and cannot be substituted for each other. \u003cstrong>Check your PROGRAF when you get a new prescription and before you take it to make sure you have received PROGRAF capsules or PROGRAF Granules.\u003c/strong> Check with the pharmacist and call your healthcare provider if you think you were given the wrong medicine.\u003c/li>","message":"Syntax not understood"},{"index":"243","line":"    \u003cli>","message":"Syntax not understood"},{"index":"244","line":"        \u003cstrong>high blood sugar (diabetes).\u003c/strong> Your healthcare provider may do blood tests to check for diabetes. Call your healthcare provider right away if you have any symptoms of high blood sugar, including:","message":"Unknown directive"},{"index":"245","line":"        \u003cbr />","message":"Syntax not understood"},{"index":"246","line":"        \u003cul class=\"two-col-list no-padding-bottom left-padded\" style=\"width:100%\">","message":"Unknown directive"},{"index":"247","line":"            \u003cli>frequent urination\u003c/li>","message":"Syntax not understood"},{"index":"248","line":"            \u003cli>drowsiness\u003c/li>","message":"Syntax not understood"},{"index":"249","line":"            \u003cli>increased thirst or hunger\u003c/li>","message":"Syntax not understood"},{"index":"250","line":"            \u003cli>loss of appetite\u003c/li>","message":"Syntax not understood"},{"index":"251","line":"            \u003cli>blurred vision\u003c/li>","message":"Syntax not understood"},{"index":"252","line":"            \u003cli>fruity smell on your breath\u003c/li>","message":"Syntax not understood"},{"index":"253","line":"            \u003cli>confusion\u003c/li>","message":"Syntax not understood"},{"index":"254","line":"            \u003cli>nausea, vomiting, or stomach pain\u003c/li>","message":"Syntax not understood"},{"index":"255","line":"        \u003c/ul>","message":"Syntax not understood"},{"index":"256","line":"    \u003c/li>","message":"Syntax not understood"},{"index":"257","line":"    \u003cli>\u003cstrong>kidney problems. \u003c/strong>Kidney problems are a serious and common side effect of PROGRAF. Your healthcare provider may do blood tests to check your kidney function.\u003c/li>","message":"Syntax not understood"},{"index":"258","line":"    \u003cli>","message":"Syntax not understood"},{"index":"259","line":"        \u003cstrong>nervous system problems.\u003c/strong> Nervous system problems are a serious and common side effect of PROGRAF. Call your healthcare provider right away if you get any of these symptoms that could be signs of a serious nervous system problem:","message":"Unknown directive"},{"index":"260","line":"        \u003cbr />","message":"Syntax not understood"},{"index":"261","line":"        \u003cul class=\"two-col-list no-padding-bottom left-padded\" style=\"width:100%\">","message":"Unknown directive"},{"index":"262","line":"            \u003cli>headache\u003c/li>","message":"Syntax not understood"},{"index":"263","line":"            \u003cli>changes in behavior\u003c/li>","message":"Syntax not understood"},{"index":"264","line":"            \u003cli>confusion\u003c/li>","message":"Syntax not understood"},{"index":"265","line":"            \u003cli>coma\u003c/li>","message":"Syntax not understood"},{"index":"266","line":"            \u003cli>seizures\u003c/li>","message":"Syntax not understood"},{"index":"267","line":"            \u003cli>tremors\u003c/li>","message":"Syntax not understood"},{"index":"268","line":"            \u003cli>changes in your vision\u003c/li>","message":"Syntax not understood"},{"index":"269","line":"            \u003cli>numbness and tingling\u003c/li>","message":"Syntax not understood"},{"index":"270","line":"        \u003c/ul>","message":"Syntax not understood"},{"index":"271","line":"    \u003c/li>","message":"Syntax not understood"},{"index":"272","line":"    \u003cli>\u003cstrong>high levels of potassium in your blood.\u003c/strong> Your healthcare provider may do blood tests to check your potassium level.\u003c/li>","message":"Syntax not understood"},{"index":"273","line":"    \u003cli>\u003cstrong>high blood pressure.\u003c/strong> High blood pressure is a serious and common side effect of PROGRAF. Your healthcare provider will monitor your blood pressure and may prescribe blood pressure medicine for you, if needed. Your healthcare provider may instruct you to check your blood pressure at home.\u003c/li>","message":"Syntax not understood"},{"index":"274","line":"    \u003cli>\u003cstrong>changes in the electrical activity of your heart (QT prolongation).\u003c/strong>\u003c/li>","message":"Syntax not understood"},{"index":"275","line":"    \u003cli>","message":"Syntax not understood"},{"index":"276","line":"        \u003cstrong>heart problems (myocardial hypertrophy).\u003c/strong> Tell your healthcare provider right away if you get any of these symptoms of heart problems:","message":"Unknown directive"},{"index":"277","line":"        \u003cbr />","message":"Syntax not understood"},{"index":"278","line":"        \u003cul class=\"two-col-list left-padded\" style=\"margin-bottom:0; width:100%\">","message":"Unknown directive"},{"index":"279","line":"            \u003cli>shortness of breath\u003c/li>","message":"Syntax not understood"},{"index":"280","line":"            \u003cli>feel lightheaded\u003c/li>","message":"Syntax not understood"},{"index":"281","line":"            \u003cli>chest pain\u003c/li>","message":"Syntax not understood"},{"index":"282","line":"            \u003cli>feel faint\u003c/li>","message":"Syntax not understood"},{"index":"283","line":"        \u003c/ul>","message":"Syntax not understood"},{"index":"284","line":"    \u003c/li>","message":"Syntax not understood"},{"index":"285","line":"    \u003cli>\u003cstrong>severe low red blood cell count (anemia).\u003c/strong>\u003c/li>","message":"Syntax not understood"},{"index":"286","line":"    \u003cli>\u003cstrong>blood clotting problems.\u003c/strong> Tell your healthcare provider right away if you have fever and bruising under the skin that may appear as red dots, with or without unexplained tiredness, confusion, yellowing of the skin or eyes, decreased urination. When taken with sirolimus or everolimus, the risk of developing these symptoms may increase.\u003c/li>","message":"Syntax not understood"},{"index":"287","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"289","line":"\u003cp>","message":"Syntax not understood"},{"index":"290","line":"    \u003cstrong>The most common side effects of PROGRAF in people who have received a kidney, liver, heart, or lung transplant are:\u003c/strong>","message":"Unknown directive"},{"index":"291","line":"\u003c/p>","message":"Syntax not understood"},{"index":"293","line":"\u003cdiv class=\"two-col-list-container\">","message":"Syntax not understood"},{"index":"294","line":"    \u003cdiv class=\"two-col-list left-padded\">","message":"Syntax not understood"},{"index":"295","line":"        \u003cdiv>infections in general, including cytomegalovirus (cmv) infection\u003c/div>","message":"Syntax not understood"},{"index":"296","line":"        \u003cdiv>tremors (shaking of the body)\u003c/div>","message":"Syntax not understood"},{"index":"297","line":"        \u003cdiv>constipation\u003c/div>","message":"Syntax not understood"},{"index":"298","line":"        \u003cdiv>diarrhea\u003c/div>","message":"Syntax not understood"},{"index":"299","line":"        \u003cdiv>headache\u003c/div>","message":"Syntax not understood"},{"index":"300","line":"        \u003cdiv>stomach pain\u003c/div>","message":"Syntax not understood"},{"index":"301","line":"        \u003cdiv>trouble sleeping\u003c/div>","message":"Syntax not understood"},{"index":"302","line":"        \u003cdiv>nausea\u003c/div>","message":"Syntax not understood"},{"index":"303","line":"        \u003cdiv>high blood sugar (diabetes)\u003c/div>","message":"Syntax not understood"},{"index":"304","line":"        \u003cdiv>low levels of magnesium in your blood\u003c/div>","message":"Syntax not understood"},{"index":"305","line":"        \u003cdiv>low levels of phosphate in your blood\u003c/div>","message":"Syntax not understood"},{"index":"306","line":"        \u003cdiv>swelling of the hands, legs, ankles, or feet\u003c/div>","message":"Syntax not understood"},{"index":"307","line":"    \u003c/div>","message":"Syntax not understood"},{"index":"308","line":"    \u003cdiv class=\"two-col-list\">","message":"Syntax not understood"},{"index":"309","line":"        \u003cdiv>weakness\u003c/div>","message":"Syntax not understood"},{"index":"310","line":"        \u003cdiv>pain\u003c/div>","message":"Syntax not understood"},{"index":"311","line":"        \u003cdiv>high levels of fat in your blood\u003c/div>","message":"Syntax not understood"},{"index":"312","line":"        \u003cdiv>high levels of potassium in your blood\u003c/div>","message":"Syntax not understood"},{"index":"313","line":"        \u003cdiv>low red blood cell count (anemia)\u003c/div>","message":"Syntax not understood"},{"index":"314","line":"        \u003cdiv>low white blood cell count\u003c/div>","message":"Syntax not understood"},{"index":"315","line":"        \u003cdiv>fever\u003c/div>","message":"Syntax not understood"},{"index":"316","line":"        \u003cdiv>numbness or tingling in your hands and feet\u003c/div>","message":"Syntax not understood"},{"index":"317","line":"        \u003cdiv>inflammation of your airway (bronchitis)\u003c/div>","message":"Syntax not understood"},{"index":"318","line":"        \u003cdiv>fluid around your heart\u003c/div>","message":"Syntax not understood"},{"index":"319","line":"    \u003c/div>","message":"Syntax not understood"},{"index":"320","line":"\u003c/div>","message":"Syntax not understood"},{"index":"321","line":"\u003cdiv style=\"clear:both\">\u003c/div>","message":"Unknown directive"},{"index":"322","line":"\u003cp>","message":"Syntax not understood"},{"index":"323","line":"    Tell your healthcare provider if you have any side effect that bothers you or that does not go away. These are not all the possible side effects of PROGRAF. For more information, ask your healthcare provider or pharmacist. Call your doctor for medical advice about side effects.","message":"Syntax not understood"},{"index":"324","line":"\u003c/p>","message":"Syntax not understood"},{"index":"326","line":"\u003cp class=\"title dark-blue-text\">","message":"Syntax not understood"},{"index":"327","line":"    General information about the safe and effective use of PROGRAF.","message":"Syntax not understood"},{"index":"328","line":"\u003c/p>","message":"Syntax not understood"},{"index":"329","line":"\u003cul class=\"padded-list no-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"330","line":"    \u003cli>Medicines are sometimes prescribed for purposes other than those listed in a Patient Information leaflet. Do not use PROGRAF for a condition for which it was not prescribed. Do not give PROGRAF to other people, even if they have the same symptoms that you have. It may harm them. You can ask your pharmacist or healthcare provider for information about PROGRAF that is written for health professionals.\u003c/li>","message":"Syntax not understood"},{"index":"331","line":"    \u003cli>The Patient Information leaflet summarizes the most important information about PROGRAF. If you would like more information, talk to your healthcare provider. \u003c/li>","message":"Syntax not understood"},{"index":"332","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"333","line":"\u003cp class=\"title\">","message":"Syntax not understood"},{"index":"334","line":"    You are encouraged to report negative side effects of prescription drugs to the FDA. Visit \u003ca href=\"https://www.fda.gov/Safety/MedWatch/default.htm\" target=\"_blank\" rel=\"noreferrer\" title=\"Report negative side effects of prescription drugs to the FDA\">www.fda.gov/medwatch\u003c/a>, or call 1-800-FDA-1088.","message":"Unknown directive"},{"index":"335","line":"\u003c/p>","message":"Syntax not understood"},{"index":"337","line":"\u003cp class=\"title\">","message":"Syntax not understood"},{"index":"338","line":"    Please see the accompanying \u003ca href=\"https://www.astellas.com/us/system/files/prografwpi_3.pdf\" target=\"_blank\" rel=\"noreferrer\">Patient Information\u003c/a> and full \u003ca href=\"https://www.astellas.com/us/system/files/prograf_7.pdf\" target=\"_blank\" rel=\"noreferrer\">Prescribing Information\u003c/a>, including Boxed Warning.","message":"Unknown directive"},{"index":"339","line":"\u003c/p>","message":"Syntax not understood"},{"index":"340","line":"        \u003c/div>","message":"Syntax not understood"},{"index":"341","line":"    \u003c/div>","message":"Syntax not understood"},{"index":"342","line":"\u003c/div>","message":"Syntax not understood"},{"index":"343","line":"\u003ca id=\"back-to-top\" href=\"#\" class=\"btn btn-primary btn-lg back-to-top\" role=\"button\" title=\"Click to return on the top page\" data-toggle=\"tooltip\" data-placement=\"left\">\u003ci class=\"glyphicon glyphicon-menu-up\" aria-hidden=\"true\">\u003c/i>\u003c/a>","message":"Syntax not understood"},{"index":"345","line":"\u003cfooter>","message":"Syntax not understood"},{"index":"346","line":"    \u003cdiv class=\"container\">","message":"Syntax not understood"},{"index":"347","line":"        \u003cdiv class=\"row\">","message":"Syntax not understood"},{"index":"348 "                                See Important Safety Information and Indication below","message":"Syntax not understood"},{"index":"383","line":"                            \u003c/div>","message":"Syntax not understood"},{"index":"384","line":"                            \u003cdiv class=\"col-xs-2 col-sm-3 isi-button\">","message":"Syntax not understood"},{"index":"385","line":"                                \u003cspan class=\"text hidden-xs\">See More\u003c/span>","message":"Syntax not understood"},{"index":"386","line":"                            \u003c/div>","message":"Syntax not understood"},{"index":"387","line":"                        \u003c/div>","message":"Syntax not understood"},{"index":"388","line":"                    \u003c/div>","message":"Syntax not understood"},{"index":"389","line":"                \u003c/div>","message":"Syntax not understood"},{"index":"390","line":"                \u003cdiv id=\"footer-slide-content\">","message":"Syntax not understood"},{"index":"391","line":"                    \u003cdiv class=\"container\">","message":"Syntax not understood"},{"index":"392","line":"                        \u003cdiv class=\"row\">","message":"Syntax not understood"},{"index":"393","line":"                            \u003cdiv class=\"col-sm-12\">","message":"Syntax not understood"},{"index":"394","line":"                                \u003cdiv class=\"isi-minimized row\">","message":"Syntax not understood"},{"index":"395","line":"                                    \u003cdiv class=\"col-sm-6 hide-on-more\">","message":"Syntax not understood"},{"index":"396","line":"                                        \u003cp class=\"title dark-blue-text\">What is the most important information I should know about PROGRAF?\u003c/p>","message":"Syntax not understood"},{"index":"397","line":"                                        \u003cp class=\"title\" style=\"padding-top: 0;\">PROGRAF can cause serious side effects, including:\u003c/p>","message":"Unknown directive"},{"index":"398","line":"                                        \u003cul>","message":"Syntax not understood"},{"index":"399","line":"                                            \u003cli>\u003cstrong style=\"margin-left:-4px\">Increased risk of cancer.\u003c/strong> People who take PROGRAF have an increased risk of getting some kinds of cancer, including skin and lymph gland cancer (lymphoma).\u003c/li>","message":"Unknown directive"},{"index":"400","line":"                                        \u003c/ul>","message":"Syntax not understood"},{"index":"401","line":"                                    \u003c/div>","message":"Syntax not understood"},{"index":"402","line":"                                    \u003cdiv class=\"col-sm-6 hide-on-more\">","message":"Syntax not understood"},{"index":"403","line":"                                        \u003cp class=\"title dark-blue-text\">What is PROGRAF?\u003c/p>","message":"Syntax not understood"},{"index":"404","line":"                                        \u003cul>","message":"Syntax not understood"},{"index":"405","line":"                                            \u003cli>\u003cspan style=\"margin-left:-4px\">PROGRAF is a prescription medicine used with other medicines to help prevent organ rejection in people who have had a kidney, liver, heart, or lung transplant.\u003c/span>\u003c/li>","message":"Unknown directive"},{"index":"406","line":"                                        \u003c/ul>","message":"Syntax not understood"},{"index":"407","line":"                                        \u003ca href=\"#\" class=\"link-to-isi\">[Read More]\u003c/a>","message":"Syntax not understood"},{"index":"408","line":"                                    \u003c/div>","message":"Syntax not understood"},{"index":"409","line":"                                \u003c/div>","message":"Syntax not understood"},{"index":"410","line":"                                \u003cp class=\"title dark-blue-text high-padding-bottom\">What is PROGRAF?\u003c/p>","message":"Syntax not understood"},{"index":"411","line":"\u003cul class=\"padded-list no-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"412","line":"    \u003cli>PROGRAF is a prescription medicine used with other medicines to help prevent organ rejection in people who have had a kidney, liver, heart, or lung transplant.\u003c/li>","message":"Syntax not understood"},{"index":"413","line":"    \u003cli>PROGRAF capsules and PROGRAF Granules are types of tacrolimus immediate-release drugs and they are not the same as tacrolimus extended-release tablets or tacrolimus extended-release capsules. Your healthcare provider should decide what medicine is right for you.\u003c/li>","message":"Syntax not understood"},{"index":"414","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"416","line":"\u003cp class=\"title dark-blue-text\">IMPORTANT SAFETY INFORMATION\u003c/p>","message":"Syntax not understood"},{"index":"418","line":"\u003cp class=\"title dark-blue-text\">What is the most important information I should know about PROGRAF?\u003c/p>","message":"Syntax not understood"},{"index":"419","line":"\u003cp class=\"title\" style=\"padding-top:0;\">PROGRAF can cause serious side effects, including:\u003c/p>","message":"Unknown directive"},{"index":"420","line":"\u003cul class=\"no-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"421","line":"    \u003cli>\u003cstrong>Increased risk of cancer.\u003c/strong> People who take PROGRAF have an increased risk of getting some kinds of cancer, including skin and lymph gland cancer (lymphoma).\u003c/li>","message":"Syntax not understood"},{"index":"422","line":"    \u003cli>","message":"Syntax not understood"},{"index":"423","line":"        \u003cstrong>Increased risk of infection.\u003c/strong> PROGRAF is a medicine that affects your immune system. PROGRAF can lower the ability of your immune system to fight infections. Serious infections can happen in people receiving PROGRAF that can cause death. \u003cstrong>Call your healthcare provider right away if you have any symptoms of an infection, including\u003c/strong>:\u003cbr />","message":"Unknown directive"},{"index":"424","line":"        \u003cul class=\"two-col-list left-padded\">","message":"Syntax not understood"},{"index":"425","line":"            \u003cli>fever\u003c/li>","message":"Syntax not understood"},{"index":"426","line":"            \u003cli>muscle aches\u003c/li>","message":"Syntax not understood"},{"index":"427","line":"            \u003cli>sweats or chills\u003c/li>","message":"Syntax not understood"},{"index":"428","line":"            \u003cli>warm, red, or painful areas on your skin\u003c/li>","message":"Syntax not understood"},{"index":"429","line":"            \u003cli>cough or flu-like symptoms\u003c/li>","message":"Syntax not understood"},{"index":"430","line":"        \u003c/ul>","message":"Syntax not understood"},{"index":"431","line":"    \u003c/li>    ","message":"Syntax not understood"},{"index":"432","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"434","line":"\u003cp>\u003cstrong>Do not take PROGRAF if you\u003c/strong> are allergic to tacrolimus or any of the ingredients in PROGRAF.\u003c/p>","message":"Syntax not understood"},{"index":"436","line":"\u003cp class=\"title dark-blue-text\">What should I tell my healthcare provider before taking PROGRAF?\u003c/p>","message":"Syntax not understood"},{"index":"437","line":"\u003cp style=\"padding-top:0;\">","message":"Unknown directive"},{"index":"438","line":"    \u003cstrong>Before you take PROGRAF, tell your healthcare provider about all of your medical conditions, including if you:\u003c/strong>","message":"Unknown directive"},{"index":"439","line":"    \u003cul class=\"left-padded\">","message":"Syntax not understood"},{"index":"440","line":"        \u003cli>plan to receive any vaccines (people taking PROGRAF should not receive live vaccines)\u003c/li>","message":"Syntax not understood"},{"index":"441","line":"        \u003cli>have or have had liver, kidney, heart, or lung problems\u003c/li>","message":"Syntax not understood"},{"index":"442","line":"        \u003cli>","message":"Syntax not understood"},{"index":"443","line":"            are pregnant or plan to become pregnant. PROGRAF can harm your unborn baby.","message":"Syntax not understood"},{"index":"444","line":"            \u003cul class=\"no-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"445","line":"                \u003cli>If you are able to become pregnant, you should use effective birth control before and during treatment with PROGRAF. Talk to your healthcare provider before starting treatment with PROGRAF about birth control methods that may be right for you.\u003c/li>","message":"Syntax not understood"},{"index":"446","line":"                \u003cli>Males who have female partners who are able to become pregnant should also use effective birth control before and during treatment with PROGRAF. Talk to your healthcare provider before starting treatment with PROGRAF about birth control methods that may be right for you.\u003c/li>","message":"Syntax not understood"},{"index":"447","line":"            \u003c/ul>","message":"Syntax not understood"},{"index":"448","line":"        \u003c/li>","message":"Syntax not understood"},{"index":"449","line":"        \u003cli>are breastfeeding or plan to breastfeed. PROGRAF passes into your breast milk. You and your healthcare provider should decide if you will breastfeed while taking PROGRAF.\u003c/li>","message":"Syntax not understood"},{"index":"450","line":"        \u003cli>plan to have children. PROGRAF may affect the ability to have children in females and males (fertility problems).\u003c/li>","message":"Syntax not understood"},{"index":"451","line":"    \u003c/ul>","message":"Syntax not understood"},{"index":"452","line":"\u003c/p>","message":"Syntax not understood"},{"index":"454","line":"\u003cp>","message":"Syntax not understood"},{"index":"455","line":"    \u003cstrong>Tell your healthcare provider about all the medicines you take, and when you start a new medicine or stop taking a medicine,\u003c/strong>","message":"Syntax not understood"},{"index":"456","line":"    including prescription and over-the-counter medicines, vitamins, natural, herbal, or nutritional supplements. \u003cstrong>Especially tell your healthcare provider if you take:\u003c/strong>","message":"Unknown directive"},{"index":"457","line":"\u003c/p>","message":"Syntax not understood"},{"index":"458","line":"\u003cdiv class=\"two-col-list-container\">","message":"Syntax not understood"},{"index":"459","line":"    \u003cdiv class=\"two-col-list\">","message":"Syntax not understood"},{"index":"460","line":"        \u003cdiv class=\"fixed-height\">sirolimus (RAPAMUNE\u003csup>&reg;\u003c/sup>): You should not take PROGRAF if you take sirolimus.\u003c/div>","message":"Unknown directive"},{"index":"461","line":"        \u003cdiv class=\"fixed-height\">cyclosporine (GENGRAF\u003csup>&reg;\u003c/sup>, NEORAL\u003csup>&reg;\u003c/sup>, and SANDIMMUNE\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"462","line":"        \u003cdiv class=\"fixed-height\">medicines called aminoglycosides that are used to treat bacterial infections\u003c/div>","message":"Syntax not understood"},{"index":"463","line":"        \u003cdiv class=\"fixed-height\">ganciclovir (CYTOVENE\u003csup>&reg;\u003c/sup> IV, VALCYTE\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"464","line":"        \u003cdiv class=\"fixed-height\">amphotericin B (ABELCET\u003csup>&reg;\u003c/sup>, AMBISOME\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"465","line":"        \u003cdiv class=\"fixed-height\">cisplatin\u003c/div>","message":"Syntax not understood"},{"index":"466","line":"        \u003cdiv class=\"fixed-height\">antiviral medicines called nucleoside reverse transcriptase inhibitors\u003c/div>","message":"Syntax not understood"},{"index":"467","line":"        \u003cdiv class=\"fixed-height\">antiviral medicines called protease inhibitors\u003c/div>","message":"Syntax not understood"},{"index":"468","line":"        \u003cdiv class=\"fixed-height\">water pill (diuretic)\u003c/div>","message":"Syntax not understood"},{"index":"469","line":"        \u003cdiv class=\"fixed-height\">medicine to treat high blood pressure\u003c/div>","message":"Syntax not understood"},{"index":"470","line":"        \u003cdiv class=\"fixed-height\">nelfinavir (VIRACEPT\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"471","line":"        \u003cdiv class=\"fixed-height\">telaprevir (INCIVEK\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"472","line":"    \u003c/div>","message":"Syntax not understood"},{"index":"473","line":"    \u003cdiv class=\"two-col-list\">","message":"Syntax not understood"},{"index":"474","line":"        \u003cdiv class=\"fixed-height\">boceprevir\u003c/div>","message":"Syntax not understood"},{"index":"475","line":"        \u003cdiv class=\"fixed-height\">ritonavir (KALETRA\u003csup>&reg;\u003c/sup>, NORVIR\u003csup>&reg;\u003c/sup>, TECHNIVIE\u003csup>TM\u003c/sup>, VIEKIRA PAK\u003csup>&reg;\u003c/sup>, VIEKIRA XR\u003csup>TM\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"476","line":"        \u003cdiv class=\"fixed-height\">letermovir (PREVYMIS\u003csup>TM\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"477","line":"        \u003cdiv class=\"fixed-height\">ketoconazole\u003c/div>","message":"Syntax not understood"},{"index":"478","line":"        \u003cdiv class=\"fixed-height\">itraconazole (ONMEL\u003csup>&reg;\u003c/sup>, SPORANOX\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"479","line":"        \u003cdiv class=\"fixed-height\">voriconazole (VFEND\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"480","line":"        \u003cdiv class=\"fixed-height\">caspofungin (CANCIDAS\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"481","line":"        \u003cdiv class=\"fixed-height\">clarithromycin (BIAXIN\u003csup>&reg;\u003c/sup>, BIAXIN\u003csup>&reg;\u003c/sup> XL, PREVPAC\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"482","line":"        \u003cdiv class=\"fixed-height\">rifampin (RIFADIN\u003csup>&reg;\u003c/sup>, RIFAMATE\u003csup>&reg;\u003c/sup>, RIFATER\u003csup>&reg;\u003c/sup>, RIMACTANE\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"483","line":"        \u003cdiv class=\"fixed-height\">rifabutin (MYCOBUTIN\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"484","line":"        \u003cdiv class=\"fixed-height\">amiodarone (NEXTERONE\u003csup>&reg;\u003c/sup>, PACERONE\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"485","line":"        \u003cdiv class=\"fixed-height\">cannabidiol (EPIDIOLEX\u003csup>&reg;\u003c/sup>)\u003c/div>","message":"Syntax not understood"},{"index":"486","line":"    \u003c/div>","message":"Syntax not understood"},{"index":"487","line":"\u003c/div>","message":"Syntax not understood"},{"index":"488","line":"\u003cdiv style=\"clear:both\">\u003c/div>","message":"Unknown directive"},{"index":"489","line":"\u003cp>Ask your healthcare provider or pharmacist if you are not sure if you take any of the medicines listed above. PROGRAF may affect the way other medicines work, and other medicines may affect how PROGRAF works. Know the medicines you take. Keep a list of your medicines and show it to your healthcare provider and pharmacist when you get a new medicine.\u003c/p>","message":"Syntax not understood"},{"index":"490","line":"\u003cp class=\"title dark-blue-text\">How Should I Take PROGRAF?\u003c/p>","message":"Syntax not understood"},{"index":"491","line":"\u003cul class=\"low-padding-bottom left-padded\">    ","message":"Syntax not understood"},{"index":"492","line":"    \u003cli>Take PROGRAF exactly as your healthcare provider tells you to take it.\u003c/li>","message":"Syntax not understood"},{"index":"493","line":"    \u003cli>Your healthcare provider may change your PROGRAF dose if needed. \u003cstrong>Do not\u003c/strong> stop taking or change your dose of PROGRAF without talking to your healthcare provider.\u003c/li>","message":"Syntax not understood"},{"index":"494","line":"    \u003cli>Take PROGRAF with or without food, the same way every day. For example, if you choose to take PROGRAF with food, you should always take PROGRAF with food.\u003c/li>","message":"Syntax not understood"},{"index":"495","line":"    \u003cli>Take PROGRAF at the same time each day, 12 hours apart. For example, if you take your first dose at 7:00 a.m., you should take your second dose at 7:00 p.m. Taking PROGRAF at the same time each day helps to keep the amount of medicine in your body at a steady level.\u003c/li>","message":"Unknown directive"},{"index":"496","line":"    \u003cli>If you take too much PROGRAF, call your healthcare provider or go to the nearest hospital emergency room right away.\u003c/li>","message":"Syntax not understood"},{"index":"497","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"499","line":"\u003cp class=\"title no-padding-top\">PROGRAF capsules:\u003c/p>","message":"Unknown directive"},{"index":"500","line":"\u003cul class=\"low-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"501","line":"    \u003cli>\u003cstrong>Do not\u003c/strong> open or crush PROGRAF capsules.\u003c/li>","message":"Syntax not understood"},{"index":"502","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"504","line":"\u003cp class=\"title no-padding-top\">PROGRAF Granules:\u003c/p>","message":"Unknown directive"},{"index":"505","line":"\u003cul class=\"low-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"506","line":"    \u003cli>Children who have trouble swallowing capsules can be given PROGRAF Granules.\u003c/li>","message":"Syntax not understood"},{"index":"507","line":"    \u003cli>Give the dose of PROGRAF Granules right after preparing. Do not save prepared PROGRAF Granules as a liquid to take at a later time.\u003c/li>","message":"Syntax not understood"},{"index":"508","line":"    \u003cli>\u003cstrong>See the \u003ca href=\"https://www.astellas.com/us/system/files/prografinstructionstouse_2.pdf\" target=\"_blank\" rel=\"noreferrer\">Instructions for Use\u003c/a> at the end of the Patient Information\u003c/strong> for detailed instructions about how to mix and give PROGRAF Granules as a liquid.\u003c/li>","message":"Unknown directive"},{"index":"509","line":"    \u003cli>If you get the granules or prepared oral suspension on your skin, wash the area well with soap and water.\u003c/li>","message":"Syntax not understood"},{"index":"510","line":"    \u003cli>If you get the granules or prepared oral suspension in your eyes, rinse with plain water.\u003c/li>","message":"Syntax not understood"},{"index":"511","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"513","line":"\u003cp class=\"title dark-blue-text\">What should I avoid while taking PROGRAF?\u003c/p>","message":"Syntax not understood"},{"index":"514","line":"\u003cul class=\"low-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"515","line":"    \u003cli>While you take PROGRAF you should not receive any live vaccines.\u003c/li>","message":"Syntax not understood"},{"index":"516","line":"    \u003cli>Limit the amount of time you spend in sunlight and avoid exposure to ultraviolet (UV) light, such as tanning machines. Wear protective clothing and use a sunscreen with a high sun protection factor (SPF).\u003c/li>","message":"Syntax not understood"},{"index":"517","line":"    \u003cli>\u003cstrong>Do not\u003c/strong> eat grapefruit or drink grapefruit juice during treatment with PROGRAF.\u003c/li>","message":"Syntax not understood"},{"index":"518","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"520","line":"\u003cp class=\"title dark-blue-text\">PROGRAF may cause serious side effects, including:\u003c/p>","message":"Unknown directive"},{"index":"521","line":"\u003cul class=\"low-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"522","line":"    \u003cli>See  \u003cstrong>\"What is the most important information I should know about PROGRAF?\"\u003c/strong>\u003c/li>","message":"Syntax not understood"},{"index":"523","line":"    \u003cli>\u003cstrong>problems from medicine errors.\u003c/strong> People who take PROGRAF have sometimes been given the wrong type of tacrolimus product. \u003cstrong>Tacrolimus extended-release medicines are not the same as PROGRAF capsules or granules\u003c/strong> and cannot be substituted for each other. \u003cstrong>Check your PROGRAF when you get a new prescription and before you take it to make sure you have received PROGRAF capsules or PROGRAF Granules.\u003c/strong> Check with the pharmacist and call your healthcare provider if you think you were given the wrong medicine.\u003c/li>","message":"Syntax not understood"},{"index":"524","line":"    \u003cli>","message":"Syntax not understood"},{"index":"525","line":"        \u003cstrong>high blood sugar (diabetes).\u003c/strong> Your healthcare provider may do blood tests to check for diabetes. Call your healthcare provider right away if you have any symptoms of high blood sugar, including:","message":"Unknown directive"},{"index":"526","line":"        \u003cbr />","message":"Syntax not understood"},{"index":"527","line":"        \u003cul class=\"two-col-list no-padding-bottom left-padded\" style=\"width:100%\">","message":"Unknown directive"},{"index":"528","line":"            \u003cli>frequent urination\u003c/li>","message":"Syntax not understood"},{"index":"529","line":"            \u003cli>drowsiness\u003c/li>","message":"Syntax not understood"},{"index":"530","line":"            \u003cli>increased thirst or hunger\u003c/li>","message":"Syntax not understood"},{"index":"531","line":"            \u003cli>loss of appetite\u003c/li>","message":"Syntax not understood"},{"index":"532","line":"            \u003cli>blurred vision\u003c/li>","message":"Syntax not understood"},{"index":"533","line":"            \u003cli>fruity smell on your breath\u003c/li>","message":"Syntax not understood"},{"index":"534","line":"            \u003cli>confusion\u003c/li>","message":"Syntax not understood"},{"index":"535","line":"            \u003cli>nausea, vomiting, or stomach pain\u003c/li>","message":"Syntax not understood"},{"index":"536","line":"        \u003c/ul>","message":"Syntax not understood"},{"index":"537","line":"    \u003c/li>","message":"Syntax not understood"},{"index":"538","line":"    \u003cli>\u003cstrong>kidney problems. \u003c/strong>Kidney problems are a serious and common side effect of PROGRAF. Your healthcare provider may do blood tests to check your kidney function.\u003c/li>","message":"Syntax not understood"},{"index":"539","line":"    \u003cli>","message":"Syntax not understood"},{"index":"540","line":"        \u003cstrong>nervous system problems.\u003c/strong> Nervous system problems are a serious and common side effect of PROGRAF. Call your healthcare provider right away if you get any of these symptoms that could be signs of a serious nervous system problem:","message":"Unknown directive"},{"index":"541","line":"        \u003cbr />","message":"Syntax not understood"},{"index":"542","line":"        \u003cul class=\"two-col-list no-padding-bottom left-padded\" style=\"width:100%\">","message":"Unknown directive"},{"index":"543","line":"            \u003cli>headache\u003c/li>","message":"Syntax not understood"},{"index":"544","line":"            \u003cli>changes in behavior\u003c/li>","message":"Syntax not understood"},{"index":"545","line":"            \u003cli>confusion\u003c/li>","message":"Syntax not understood"},{"index":"546","line":"            \u003cli>coma\u003c/li>","message":"Syntax not understood"},{"index":"547","line":"            \u003cli>seizures\u003c/li>","message":"Syntax not understood"},{"index":"548","line":"            \u003cli>tremors\u003c/li>","message":"Syntax not understood"},{"index":"549","line":"            \u003cli>changes in your vision\u003c/li>","message":"Syntax not understood"},{"index":"550","line":"            \u003cli>numbness and tingling\u003c/li>","message":"Syntax not understood"},{"index":"551","line":"        \u003c/ul>","message":"Syntax not understood"},{"index":"552","line":"    \u003c/li>","message":"Syntax not understood"},{"index":"553","line":"    \u003cli>\u003cstrong>high levels of potassium in your blood.\u003c/strong> Your healthcare provider may do blood tests to check your potassium level.\u003c/li>","message":"Syntax not understood"},{"index":"554","line":"    \u003cli>\u003cstrong>high blood pressure.\u003c/strong> High blood pressure is a serious and common side effect of PROGRAF. Your healthcare provider will monitor your blood pressure and may prescribe blood pressure medicine for you, if needed. Your healthcare provider may instruct you to check your blood pressure at home.\u003c/li>","message":"Syntax not understood"},{"index":"555","line":"    \u003cli>\u003cstrong>changes in the electrical activity of your heart (QT prolongation).\u003c/strong>\u003c/li>","message":"Syntax not understood"},{"index":"556","line":"    \u003cli>","message":"Syntax not understood"},{"index":"557","line":"        \u003cstrong>heart problems (myocardial hypertrophy).\u003c/strong> Tell your healthcare provider right away if you get any of these symptoms of heart problems:","message":"Unknown directive"},{"index":"558","line":"        \u003cbr />","message":"Syntax not understood"},{"index":"559","line":"        \u003cul class=\"two-col-list left-padded\" style=\"margin-bottom:0; width:100%\">","message":"Unknown directive"},{"index":"560","line":"            \u003cli>shortness of breath\u003c/li>","message":"Syntax not understood"},{"index":"561","line":"            \u003cli>feel lightheaded\u003c/li>","message":"Syntax not understood"},{"index":"562","line":"            \u003cli>chest pain\u003c/li>","message":"Syntax not understood"},{"index":"563","line":"            \u003cli>feel faint\u003c/li>","message":"Syntax not understood"},{"index":"564","line":"        \u003c/ul>","message":"Syntax not understood"},{"index":"565","line":"    \u003c/li>","message":"Syntax not understood"},{"index":"566","line":"    \u003cli>\u003cstrong>severe low red blood cell count (anemia).\u003c/strong>\u003c/li>","message":"Syntax not understood"},{"index":"567","line":"    \u003cli>\u003cstrong>blood clotting problems.\u003c/strong> Tell your healthcare provider right away if you have fever and bruising under the skin that may appear as red dots, with or without unexplained tiredness, confusion, yellowing of the skin or eyes, decreased urination. When taken with sirolimus or everolimus, the risk of developing these symptoms may increase.\u003c/li>","message":"Syntax not understood"},{"index":"568","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"570","line":"\u003cp>","message":"Syntax not understood"},{"index":"571","line":"    \u003cstrong>The most common side effects of PROGRAF in people who have received a kidney, liver, heart, or lung transplant are:\u003c/strong>","message":"Unknown directive"},{"index":"572","line":"\u003c/p>","message":"Syntax not understood"},{"index":"574","line":"\u003cdiv class=\"two-col-list-container\">","message":"Syntax not understood"},{"index":"575","line":"    \u003cdiv class=\"two-col-list left-padded\">","message":"Syntax not understood"},{"index":"576","line":"        \u003cdiv>infections in general, including cytomegalovirus (cmv) infection\u003c/div>","message":"Syntax not understood"},{"index":"577","line":"        \u003cdiv>tremors (shaking of the body)\u003c/div>","message":"Syntax not understood"},{"index":"578","line":"        \u003cdiv>constipation\u003c/div>","message":"Syntax not understood"},{"index":"579","line":"        \u003cdiv>diarrhea\u003c/div>","message":"Syntax not understood"},{"index":"580","line":"        \u003cdiv>headache\u003c/div>","message":"Syntax not understood"},{"index":"581","line":"        \u003cdiv>stomach pain\u003c/div>","message":"Syntax not understood"},{"index":"582","line":"        \u003cdiv>trouble sleeping\u003c/div>","message":"Syntax not understood"},{"index":"583","line":"        \u003cdiv>nausea\u003c/div>","message":"Syntax not understood"},{"index":"584","line":"        \u003cdiv>high blood sugar (diabetes)\u003c/div>","message":"Syntax not understood"},{"index":"585","line":"        \u003cdiv>low levels of magnesium in your blood\u003c/div>","message":"Syntax not understood"},{"index":"586","line":"        \u003cdiv>low levels of phosphate in your blood\u003c/div>","message":"Syntax not understood"},{"index":"587","line":"        \u003cdiv>swelling of the hands, legs, ankles, or feet\u003c/div>","message":"Syntax not understood"},{"index":"588","line":"    \u003c/div>","message":"Syntax not understood"},{"index":"589","line":"    \u003cdiv class=\"two-col-list\">","message":"Syntax not understood"},{"index":"590","line":"        \u003cdiv>weakness\u003c/div>","message":"Syntax not understood"},{"index":"591","line":"        \u003cdiv>pain\u003c/div>","message":"Syntax not understood"},{"index":"592","line":"        \u003cdiv>high levels of fat in your blood\u003c/div>","message":"Syntax not understood"},{"index":"593","line":"        \u003cdiv>high levels of potassium in your blood\u003c/div>","message":"Syntax not understood"},{"index":"594","line":"        \u003cdiv>low red blood cell count (anemia)\u003c/div>","message":"Syntax not understood"},{"index":"595","line":"        \u003cdiv>low white blood cell count\u003c/div>","message":"Syntax not understood"},{"index":"596","line":"        \u003cdiv>fever\u003c/div>","message":"Syntax not understood"},{"index":"597","line":"        \u003cdiv>numbness or tingling in your hands and feet\u003c/div>","message":"Syntax not understood"},{"index":"598","line":"        \u003cdiv>inflammation of your airway (bronchitis)\u003c/div>","message":"Syntax not understood"},{"index":"599","line":"        \u003cdiv>fluid around your heart\u003c/div>","message":"Syntax not understood"},{"index":"600","line":"    \u003c/div>","message":"Syntax not understood"},{"index":"601","line":"\u003c/div>","message":"Syntax not understood"},{"index":"602","line":"\u003cdiv style=\"clear:both\">\u003c/div>","message":"Unknown directive"},{"index":"603","line":"\u003cp>","message":"Syntax not understood"},{"index":"604","line":"    Tell your healthcare provider if you have any side effect that bothers you or that does not go away. These are not all the possible side effects of PROGRAF. For more information, ask your healthcare provider or pharmacist. Call your doctor for medical advice about side effects.","message":"Syntax not understood"},{"index":"605","line":"\u003c/p>","message":"Syntax not understood"},{"index":"607","line":"\u003cp class=\"title dark-blue-text\">","message":"Syntax not understood"},{"index":"608","line":"    General information about the safe and effective use of PROGRAF.","message":"Syntax not understood"},{"index":"609","line":"\u003c/p>","message":"Syntax not understood"},{"index":"610","line":"\u003cul class=\"padded-list no-padding-bottom left-padded\">","message":"Syntax not understood"},{"index":"611","line":"    \u003cli>Medicines are sometimes prescribed for purposes other than those listed in a Patient Information leaflet. Do not use PROGRAF for a condition for which it was not prescribed. Do not give PROGRAF to other people, even if they have the same symptoms that you have. It may harm them. You can ask your pharmacist or healthcare provider for information about PROGRAF that is written for health professionals.\u003c/li>","message":"Syntax not understood"},{"index":"612","line":"    \u003cli>The Patient Information leaflet summarizes the most important information about PROGRAF. If you would like more information, talk to your healthcare provider. \u003c/li>","message":"Syntax not understood"},{"index":"613","line":"\u003c/ul>","message":"Syntax not understood"},{"index":"614","line":"\u003cp class=\"title\">","message":"Syntax not understood"},{"index":"615","line":"    You are encouraged to report negative side effects of prescription drugs to the FDA. Visit \u003ca href=\"https://www.fda.gov/Safety/MedWatch/default.htm\" target=\"_blank\" rel=\"noreferrer\" title=\"Report negative side effects of prescription drugs to the FDA\">www.fda.gov/medwatch\u003c/a>, or call 1-800-FDA-1088.","message":"Unknown directive"},{"index":"616","line":"\u003c/p>","message":"Syntax not understood"},{"index":"618","line":"\u003cp class=\"title\">","message":"Syntax not understood"},{"index":"619","line":"    Please see the accompanying \u003ca href=\"https://www.astellas.com/us/system/files/prografwpi_3.pdf\" target=\"_blank\" rel=\"noreferrer\">Patient Information\u003c/a> and full \u003ca href=\"https://www.astellas.com/us/system/files/prograf_7.pdf\" target=\"_blank\" rel=\"noreferrer\">Prescribing Information\u003c/a>, including Boxed Warning.","message":"Unknown directive"},{"index":"620","line":"\u003c/p>","message":"Syntax not understood"},{"index":"621","line":"                            \u003c/div>","message":"Syntax not understood"},{"index":"622","line":"                        \u003c/div>","message":"Syntax not understood"},{"index":"623","line":"                    \u003c/div>","message":"Syntax not understood"},{"index":"624"," le text (usually URLs) found in:\n    1. The footer\n    2. .lh-node (outerHTML)\n    3. .lh-code\n\n  With that sorted, the next challenge is appropriate column sizing and text wrapping inside our\n  .lh-details tables. Even more fun.\n    * We don\'t want table headers ("Potential Savings (ms)") to wrap or their column values, but\n    we\'d be happy for the URL column to wrap if the URLs are particularly long.\n    * We want the narrow columns to remain narrow, providing the most column width for URL\n    * We don\'t want the table to extend past 100% width.\n    * Long URLs in the URL column can wrap. Util.getURLDisplayName maxes them out at 64 characters,\n      but they do not get any overflow:ellipsis treatment.\n  */\n  word-break: break-word;\n}\n\n.lh-audit-group a,\n.lh-category-header__description a,\n.lh-audit__description a,\n.lh-warnings a,\n.lh-footer a,\n.lh-table-column--link a {\n  color: var(--color-informative);\n}\n\n.lh-audit__description, .lh-audit__stackpack {\n  --inner-audit-padding-right: var(--stackpack-padding-horizontal);\n  padding-left: var(--audit-description-padding-left);\n  padding-right: var(--inner-audit-padding-right);\n  padding-top: 8px;\n  padding-bottom: 8px;\n}\n\n.lh-details {\n  font-size: var(--report-font-size);\n  margin-top: var(--default-padding);\n  margin-bottom: var(--default-padding);\n  margin-left: var(--audit-description-padding-left);\n  /* whatever the .lh-details side margins are */\n  width: 100%;\n}\n\n.lh-audit__stackpack {\n  display: flex;\n  align-items: center;\n}\n\n.lh-audit__stackpack__img {\n  max-width: 50px;\n  margin-right: var(--default-padding)\n}\n\n/* Report header */\n\n.lh-report-icon {\n  display: flex;\n  align-items: center;\n  padding: 10px 12px;\n  cursor: pointer;\n}\n.lh-report-icon[disabled] {\n  opacity: 0.3;\n  pointer-events: none;\n}\n\n.lh-report-icon::before {\n  content: "";\n  margin-right: 5px;\n  background-repeat: no-repeat;\n  width: var(--report-icon-size);\n  heig pet-color);\n  font-size: var(--report-monospace-font-size);\n  line-height: 20px;\n}\n\n/* Score */\n\n.lh-audit__score-icon {\n  width: var(--score-icon-size);\n  height: var(--score-icon-size);\n  margin: var(--score-icon-margin);\n}\n\n.lh-audit--pass .lh-audit__display-text {\n  color: var(--color-pass-secondary);\n}\n.lh-audit--pass .lh-audit__score-icon,\n.lh-scorescale-range--pass::before {\n  border-radius: 100%;\n  background: var(--color-pass);\n}\n\n.lh-audit--average .lh-audit__display-text {\n  color: var(--color-average-secondary);\n}\n.lh-audit--average .lh-audit__score-icon,\n.lh-scorescale-range--average::before {\n  background: var(--color-average);\n  width: var(--icon-square-size);\n  height: var(--icon-square-size);\n}\n\n.lh-audit--fail .lh-audit__display-text {\n  color: var(--color-fail-secondary);\n}\n.lh-audit--fail .lh-audit__score-icon,\n.lh-audit--error .lh-audit__score-icon,\n.lh-scorescale-range--fail::before {\n  border-left: calc(var(--score-icon-size) / 2) solid transparent;\n  border-right: calc(var(--score-icon-size) / 2) solid transparent;\n  border-bottom: var(--score-icon-size) solid var(--color-fail);\n}\n\n.lh-audit--manual .lh-audit__display-text,\n.lh-audit--notapplicable .lh-audit__display-text {\n  color: var(--color-gray-600);\n}\n.lh-audit--manual .lh-audit__score-icon,\n.lh-audit--notapplicable .lh-audit__score-icon {\n  border: 2px solid var(--color-gray-400);\n  border-radius: 100%;\n  background: none;\n}\n\n.lh-audit--informative .lh-audit__display-text {\n  color: var(--color-gray-600);\n}\n\n.lh-audit--informative .lh-audit__score-icon {\n  border: 2px solid var(--color-gray-400);\n  border-radius: 100%;\n}\n\n.lh-audit__description,\n.lh-audit__stackpack {\n  color: var(--report-text-color-secondary);\n}\n.lh-audit__adorn {\n  border: 1px solid slategray;\n  border-radius: 3px;\n  margin: 0 3px;\n  padding: 0 2px;\n  line-height: 1.1;\n  display: inline-block;\n  font-size: 90%;\n}\n\n.lh-category-header__description  {\n  font-size: var(--report-font-size);\n  text-align: center;\n  margin: 0px auto;\n  max-width: 400px;\n}\n\n\n.lh-audit__display-text,\n.lh-load-opportunity__sparkline,\n.lh-chevron-container {\n  margin: 0 var(--audit-margin-horizontal);\n}\n.lh-chevron-container {\n  margin-right: 0;\n}\n\n.lh-audit__title-and-text {\n  flex: 1;\n}\n\n.lh-audit__title-and-text code {\n  color: var(--snippet-color);\n  font-size: var(--report-monospace-font-size);\n}\n\n/* Prepend display text with em dash separator. But not in Opportunities. */\n.lh-audit__display-text:not(:empty):before {\n  content: \'—\';\n  margin-right: var(--audit-margin-horizontal);\n}\n.lh-audit-group.lh-audit-group--load-opportunities .lh-audit__display-text:not(:empty):before {\n  display: none;\n}\n\n/* Expandable Details (Audit Groups, Audits) */\n.lh-audit__header {\n  display: flex;\n  align-items: center;\n  font-weight: 500;\n  padding: var(--audit-padding-vertical) 0;\n}\n\n.lh-audit--load-opportunity .lh-audit__header {\n  display: block;\n}\n\n\n.lh-metricfilter {\n  text-align: right;\n  margin-top: var(--default-padding);\n}\n\n.lh-metricfilter__radio {\n  position: absolute;\n  left: -9999px;\n}\n.lh-metricfilter input[type=\'radio\']:focus-visible + label {\n  outline: -webkit-focus-ring-color auto 1px;\n}\n\n.lh-metricfilter__label {\n  border: solid 1px var(--color-gray-400);\n  align-items: center;\n  justify-content: center;\n  padding: 2px 5px;\n  width: 50%;\n  height: 28px;\n  cursor: pointer;\n  font-size: 90%;\n}\n\n.lh-metricfilter__label:first-of-type {\n  border-top-left-radius: 5px;\n  border-bottom-left-radius: 5px;\n  margin-left: 5px;\n}\n.lh-metricfilter__label:last-of-type {\n  border-top-right-radius: 5px;\n  border-bottom-right-radius: 5px;\n}\n\n.lh-metricfilter__label--active {\n  background: var(--color-blue-A700);\n  color: var(--color-white);\n}\n/* Give the \'All\' choice a more muted display */\n.lh-metricfilter__label--active[for="metric-All"] {\n  background-color: var(--color-blue-200) !important;\n  color: black !important;\n}\n\n/* If audits are filtered, hide the itemcount for Passed Audits… */\n.lh-category--filtered .lh-audit-group .lh-audit-group__itemcount {\n  display: none;\n}\n\n\n.lh-audit__header:hover {\n  background-color: var(--color-hover);\n}\n\n/* We want to hide the browser\'s default arrow marker on summary elements. Admittedly, it\'s complicated. */\n.lh-audit-group > summary,\n.lh-expandable-details > summary {\n  /* Blink 89+ and Firefox will hide the arrow when display is changed from (new) default of `list-item` to block.  https://chromestatus.com/feature/6730096436051968*/\n  display: block;\n}\n/* Safari and Blink <=88 require using the -webkit-details-marker selector */\n.lh-audit-group > summary::-webkit-details-marker,\n.lh-expandable-details > summary::-webkit-details-marker {\n  display: none;\n}\n\n/* Perf Metric */\n\n.lh-metrics-container {\n  display: grid;\n  grid-template-rows: 1fr 1fr 1fr;\n  grid-auto-flow: column;\n  grid-column-gap: 24px;\n}\n\n.lh-metric {\n  border-top: 1px solid var(--report-border-color-secondary);\n}\n\n@media screen and (min-width: 640px) {\n  .lh-metric:nth-child(3n+3) {\n    border-bottom: 1px solid var(--report-border-color-secondary);\n  }\n}\n\n@media screen and (max-width: 640px) {\n  .lh-metrics-container {\n    display: block;\n  }\n\n  .lh-metric:nth-last-child(-n+1) {\n    border-bottom: 1px solid var(--report-border-color-secondary);\n  }\n}\n\n.lh-metric__innerwrap {\n  display: grid;\n  /**\n   * Icon -- Metric Name\n   *      -- Metric Value\n   */\n  grid-template-columns: calc(var(--score-icon-size) + var(--score-icon-margin-left) + var(--score-icon-margin-right)) 1fr;\n  align-items: center;\n  padding: 10px 0;\n}\n\n.lh-metric__details {\n  order: -1;\n}\n\n.lh-metric__title {\n  flex: 1;\n  font-weight: 500;\n}\n\n.lh-metrics__disclaimer {\n  color: var(--color-gray-600);\n  margin: var(--section-padding-vertical) 0;\n}\n\n.lh-calclink {\n  padding-left: calc(1ex / 3);\n}\n\n.lh-metric__description {\n  display: none;\n  grid-column-start: 2;\n  grid-column-end: 4;\n  color: var(--report-text-color-secondary);\n}\n\n.lh-metric__value {\n  font-size: var(--metric-value-font-size);\n  margin: calc(var(--default-padding) / 2) 0;\n  white-space: nowrap; /* No wrapping between metric value and the icon */\n  font-weight: 500;\n  grid-column-start: 2;\n}\n\n/* Change the grid to 3 columns for narrow viewport. */\n@media screen and (max-width: 535px) {\n  .lh-metric__innerwrap {\n  /**\n   * Icon -- Metric Name -- Metric Value\n   */\n    grid-template-columns: calc(var(--score-icon-size) + var(--score-icon-margin-left) + var(--score-icon-margin-right)) 2fr 1fr;\n  }\n  .lh-metric__value {\n    justify-self: end;\n    grid-column-start: unset;\n  }\n}\n\n/* No-JS toggle switch */\n/* Keep this selector sync\'d w/ `magicSelector` in report-ui-features-test.js */\n .lh-metrics-toggle__input:checked ~ .lh-metrics-container .lh-metric__description {\n  display: block;\n}\n\n.lh-metrics-toggle__input {\n  cursor: pointer;\n  opacity: 0;\n  position: absolute;\n  right: 0;\n  width: 74px;\n  height: 28px;\n  top: -3px;\n}\n.lh-metrics-toggle__label {\n  display: flex;\n  background-color: #eee;\n  border-radius: 20px;\n  overflow: hidden;\n  position: absolute;\n  right: 0;\n  top: -3px;\n  pointer-events: none;\n}\n.lh-metrics-toggle__input:focus + label {\n  outline: -webkit-focus-ring-color auto 3px;\n}\n.lh-metrics-toggle__icon {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 2px 5px;\n  width: 50%;\n  height: 28px;\n}\n.lh-metrics-toggle__input:not(:checked) + label .lh-metrics-toggle__icon--less,\n.lh-metrics-toggle__input:checked + label .lh-metrics-toggle__icon--more {\n  background-color: var(--color-blue-A700);\n  --metric-toggle-lines-fill: var(--color-white);\n}\n.lh-metrics-toggle__lines {\n  fill: var(--metric-toggle-lines-fill);\n}\n\n.lh-metrics-toggle
